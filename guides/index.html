<title>The Twelve Leader's Console</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Archivo:wght@400;500;600&display=swap">
<style>
  :root{
    --ink:#0E1620; --raise:#16212E; --raise-2:#1C2938;
    --line:#27343F; --line-soft:#1F2B37;
    --parch:#E9E3D7; --slate:#93A1AF; --slate-dim:#6D7B89;
    --brass:#C89B3C; --brass-dim:#8A6C2C; --oxblood:#B4534A;
    --serif:'Spectral',Georgia,'Times New Roman',serif;
    --sans:'Archivo','Helvetica Neue',Arial,sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--ink);color:var(--parch);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:var(--brass)}
  :focus-visible{outline:2px solid var(--brass);outline-offset:2px}

  /* ============ shell ============ */
  .shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh;align-items:start}

  /* ============ nav rail ============ */
  .nav{
    position:sticky;top:0;height:100vh;overflow-y:auto;
    background:var(--raise);border-right:1px solid var(--line);padding:22px 0 30px
  }
  .brand{padding:0 20px 18px;border-bottom:1px solid var(--line);margin-bottom:16px}
  .brand a{text-decoration:none;color:inherit;display:block}
  .brand .sup{font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--brass)}
  .brand .nm{font-family:var(--serif);font-size:1.5rem;font-weight:700;letter-spacing:-.01em;line-height:1.1;margin-top:5px}
  .brand .cad{font-size:11px;color:var(--slate-dim);margin-top:6px;line-height:1.4}
  .navgroup{padding:0 12px;margin-bottom:14px}
  .navgroup .gl{
    font-size:9.5px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;
    color:var(--slate-dim);padding:0 8px 7px
  }
  .navlink{
    display:grid;grid-template-columns:22px 1fr;gap:9px;align-items:baseline;
    padding:7px 8px;border-radius:3px;text-decoration:none;color:var(--slate);
    font-size:13.5px;line-height:1.3;border-left:2px solid transparent
  }
  .navlink .i{font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--slate-dim);font-weight:600}
  .navlink:hover{background:var(--raise-2);color:var(--parch)}
  .navlink.on{background:var(--ink);color:var(--brass);border-left-color:var(--brass);font-weight:500}
  .navlink.on .i{color:var(--brass)}
  .navfoot{padding:14px 20px 0;margin-top:6px;border-top:1px solid var(--line);font-size:11px;color:var(--slate-dim);line-height:1.55}

  /* ============ main ============ */
  .main{min-width:0}
  .wrap{max-width:1120px;margin:0 auto;padding:0 34px 80px}

  /* ---- masthead ---- */
  .mast{padding:38px 0 26px;border-bottom:1px solid var(--line)}
  .eyebrow{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--brass);display:flex;flex-wrap:wrap;gap:13px;align-items:baseline}
  .eyebrow .sep{color:var(--slate-dim)}
  .eyebrow .plain{color:var(--slate)}
  h1{font-family:var(--serif);font-weight:700;font-size:clamp(2.2rem,5.4vw,3.7rem);line-height:1.03;margin:13px 0 0;letter-spacing:-.02em;text-wrap:balance}
  h1 .sub{display:block;font-size:.34em;font-weight:500;letter-spacing:.01em;color:var(--slate);margin-top:13px;font-style:italic}
  .hook{font-family:var(--serif);font-size:clamp(1.05rem,2vw,1.28rem);line-height:1.5;max-width:62ch;margin:20px 0 0}
  .hook em{color:var(--brass);font-style:italic}

  /* ---- spine ---- */
  .spine{margin:32px 0 0;padding:24px 0 4px;border-top:1px solid var(--line-soft)}
  .spine-label{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--slate-dim);margin-bottom:19px}
  .stations{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:stretch}
  .station{padding:0 4px}
  .station .ref{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--brass-dim);margin-bottom:9px}
  .station h3{font-family:var(--serif);font-size:1.4rem;font-weight:600;margin:0 0 8px;line-height:1.15;letter-spacing:-.01em}
  .station p{margin:0;color:var(--slate);font-size:13.5px;line-height:1.55;max-width:32ch}
  .station.cost .ref,.station.cost h3{color:var(--oxblood)}
  .link{display:flex;flex-direction:column;padding:0 20px;min-width:70px}
  .link .rule{height:1px;background:linear-gradient(90deg,var(--line),var(--brass-dim),var(--line));margin-top:29px;position:relative}
  .link .rule::after{content:"";position:absolute;right:-1px;top:-3.5px;width:7px;height:7px;background:var(--brass);transform:rotate(45deg)}
  .link .word{font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--slate-dim);text-align:center;margin-top:11px}

  /* ---- body grid ---- */
  .grid{display:grid;grid-template-columns:272px 1fr;gap:42px;margin-top:48px;align-items:start}
  .rail{position:sticky;top:20px}
  .rail h2{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--slate-dim);margin:0}
  .startline{display:flex;align-items:center;gap:9px;margin:14px 0 18px}
  .startline label{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--slate-dim)}
  input[type=time]{background:var(--raise);color:var(--parch);border:1px solid var(--line);border-radius:3px;padding:5px 8px;font-family:var(--sans);font-size:14px;font-variant-numeric:tabular-nums}
  .beats{list-style:none;margin:0;padding:0;border-left:1px solid var(--line)}
  .beat{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:7px 0 7px 14px;position:relative}
  .beat .clock{font-size:13px;font-variant-numeric:tabular-nums;color:var(--slate-dim);padding-top:1px}
  .beat .name{font-size:13.5px;color:var(--slate);line-height:1.35}
  .beat .mins{font-size:11px;color:var(--slate-dim);margin-left:5px;font-variant-numeric:tabular-nums}
  .beat::before{content:"";position:absolute;left:-3.5px;top:14px;width:6px;height:6px;background:var(--line);border-radius:50%}
  .beat.teach .name{color:var(--parch)}
  .beat.pivot .name,.beat.heart .name{color:var(--parch);font-weight:500}
  .beat.pivot::before,.beat.heart::before{background:var(--brass)}
  .beat.now{background:var(--raise);border-radius:0 3px 3px 0}
  .beat.now::before{background:var(--brass);box-shadow:0 0 0 3px rgba(200,155,60,.18)}
  .beat.now .clock,.beat.now .name{color:var(--brass)}
  .teach-note{font-size:11.5px;color:var(--slate-dim);line-height:1.45;margin:16px 0 0;padding-left:15px;border-left:1px solid var(--line-soft)}
  .clockwarn{margin-top:18px;padding:13px 14px;background:var(--raise);border-left:2px solid var(--oxblood);font-size:12.5px;line-height:1.5;color:var(--slate)}
  .clockwarn b{color:var(--parch);font-weight:600}

  .col{display:flex;flex-direction:column;gap:44px;min-width:0}
  .shead{display:flex;align-items:baseline;gap:12px;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:21px}
  .shead .t{font-family:var(--serif);font-size:1.45rem;font-weight:600;margin:0;letter-spacing:-.01em}
  .shead .when{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--brass-dim);font-variant-numeric:tabular-nums;white-space:nowrap;margin-left:auto}
  p{margin:0 0 14px}
  .lede{max-width:66ch}
  .lede:last-child{margin-bottom:0}
  .lede b{font-weight:600}
  .lede em{font-style:italic;color:var(--brass)}

  .scenes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line-soft)}
  .scene{background:var(--ink);padding:18px 20px 20px}
  .scene .tag{font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--brass-dim);margin-bottom:7px}
  .scene h4{font-family:var(--serif);font-size:1.1rem;font-weight:600;margin:0 0 7px}
  .scene p{margin:0;font-size:13.5px;color:var(--slate);line-height:1.55}
  .scene q{font-family:var(--serif);font-style:italic;color:var(--parch);quotes:'\201C' '\201D'}

  .versus{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line)}
  .versus > div{padding:20px 22px}
  .versus .a{border-right:1px solid var(--line)}
  .versus .k{font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px;color:var(--slate-dim)}
  .versus .a .k{color:var(--brass-dim)}
  .versus .b .k{color:var(--oxblood)}
  .versus blockquote{margin:0 0 12px;font-family:var(--serif);font-style:italic;font-size:1.06rem;line-height:1.45;color:var(--parch)}
  .versus p{margin:0;font-size:13.5px;color:var(--slate)}
  .versus p em{font-style:italic;color:var(--parch)}
  .downline{text-align:center;font-family:var(--serif);font-style:italic;font-size:1.14rem;color:var(--brass);margin:20px 0 0}

  .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(212px,1fr));gap:1px;background:var(--line-soft)}
  .fact{background:var(--ink);padding:15px 18px 17px}
  .fact dt{font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--slate-dim);margin-bottom:6px}
  .fact dd{margin:0;font-size:13.5px;line-height:1.5;color:var(--parch)}
  .fact dd .note{color:var(--slate-dim);font-style:italic;font-family:var(--serif)}
  .tradition{margin-top:22px;padding:15px 18px;background:var(--raise);font-size:12.5px;color:var(--slate);line-height:1.6}
  .tradition .k{font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--brass-dim);margin-bottom:8px}
  .tradition b{color:var(--parch);font-weight:600}
  .tradition em{font-style:italic}

  .guardrail{border-top:2px solid var(--brass);background:var(--raise);padding:30px 34px 32px}
  .guardrail .say{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--brass);margin-bottom:18px}
  .guardrail .speech{font-family:var(--serif);font-size:clamp(1.12rem,2.1vw,1.45rem);line-height:1.5;margin:0;max-width:56ch}
  .guardrail .speech em{font-style:italic;color:var(--brass)}
  .guardrail .foot{margin:24px 0 0;padding-top:18px;border-top:1px solid var(--line);font-size:13px;color:var(--slate);max-width:66ch}
  .guardrail .foot b{color:var(--parch);font-weight:600}

  .qs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px;background:var(--line-soft)}
  .qs li{background:var(--ink);display:grid;grid-template-columns:34px 1fr;gap:14px;padding:16px 4px 17px 0}
  .qs .n{font-family:var(--serif);font-size:1.28rem;font-weight:600;color:var(--brass-dim);text-align:right;font-variant-numeric:tabular-nums;line-height:1.25}
  .qs .q{margin:0;max-width:64ch}
  .qs .q b{font-weight:600;color:var(--parch)}
  .qs .q span{color:var(--slate)}
  .qs li.land{background:var(--raise-2);grid-template-columns:34px 1fr auto}
  .qs li.land .n{color:var(--brass)}
  .qs li.land .tick{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--brass);align-self:center;padding-right:14px;white-space:nowrap}
  .couples{margin-top:20px;padding:18px 20px;border:1px dashed var(--line);font-size:13.5px;color:var(--slate);line-height:1.6}
  .couples .k{font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--slate-dim);margin-bottom:9px}
  .couples em{font-family:var(--serif);font-style:italic;color:var(--parch)}
  .dry{margin-top:16px;font-size:12.5px;color:var(--slate-dim);line-height:1.55}
  .dry b{color:var(--slate);font-weight:600}
  .dry em{font-family:var(--serif);color:var(--slate);font-style:italic}

  .takeaway{padding:32px 0 0;border-top:1px solid var(--line)}
  .takeaway .k{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--slate-dim);margin-bottom:16px}
  .takeaway blockquote{margin:0;font-family:var(--serif);font-size:clamp(1.28rem,2.6vw,1.8rem);line-height:1.38;font-style:italic;max-width:46ch;letter-spacing:-.01em}
  .takeaway blockquote b{font-style:normal;font-weight:600;color:var(--brass)}
  .anchors{font-size:13px;color:var(--slate);line-height:1.85}
  .anchors b{color:var(--parch);font-weight:500;font-family:var(--serif);font-size:14px}

  /* pager */
  .pager{display:flex;justify-content:space-between;gap:16px;margin-top:52px;padding-top:22px;border-top:1px solid var(--line)}
  .pager a{
    text-decoration:none;color:var(--slate);font-size:13px;line-height:1.4;
    display:block;max-width:46%
  }
  .pager a:hover{color:var(--brass)}
  .pager .k{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--slate-dim);margin-bottom:5px}
  .pager .nm{font-family:var(--serif);font-size:1.1rem;color:var(--parch)}
  .pager a:hover .nm{color:var(--brass)}
  .pager .r{text-align:right;margin-left:auto}

  /* ============ overview ============ */
  .ov-mast{padding:44px 0 30px;border-bottom:1px solid var(--line)}
  .ov-lede{font-family:var(--serif);font-size:clamp(1.05rem,2vw,1.26rem);line-height:1.55;max-width:64ch;margin:20px 0 0;color:var(--parch)}
  .ov-lede em{font-style:italic;color:var(--brass)}
  .ov-note{max-width:66ch;margin:18px 0 0;font-size:13.5px;color:var(--slate)}
  .ov-note b{color:var(--parch);font-weight:600}
  .ovgroup{margin-top:44px}
  .ovgroup .gh{display:flex;align-items:baseline;gap:12px;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:2px}
  .ovgroup .gh .t{font-family:var(--serif);font-size:1.3rem;font-weight:600;margin:0}
  .ovgroup .gh .d{font-size:12.5px;color:var(--slate-dim);margin-left:auto;text-align:right;max-width:46ch;line-height:1.45}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:1px;background:var(--line-soft)}
  .card{background:var(--ink);padding:19px 20px 21px;text-decoration:none;color:inherit;display:block;border-top:2px solid transparent}
  .card:hover{background:var(--raise);border-top-color:var(--brass)}
  .card .i{font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--brass-dim);font-variant-numeric:tabular-nums}
  .card h4{font-family:var(--serif);font-size:1.28rem;font-weight:600;margin:7px 0 8px;line-height:1.14;letter-spacing:-.01em}
  .card p{margin:0;font-size:13px;color:var(--slate);line-height:1.5}
  .card:hover h4{color:var(--brass)}

  .howto{margin-top:48px;padding:24px 26px;background:var(--raise);border-left:2px solid var(--brass-dim)}
  .howto .k{font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);margin-bottom:13px}
  .howto ul{margin:0;padding-left:19px;font-size:13.5px;color:var(--slate);line-height:1.75}
  .howto b{color:var(--parch);font-weight:600}
  .howto kbd{
    font-family:var(--sans);font-size:11px;background:var(--ink);border:1px solid var(--line);
    border-radius:3px;padding:1px 5px;color:var(--parch)
  }

  footer{margin-top:54px;padding-top:20px;border-top:1px solid var(--line);font-size:12px;color:var(--slate-dim);line-height:1.6}
  footer b{color:var(--slate);font-weight:500}

  @media (max-width:1000px){
    .shell{grid-template-columns:1fr}
    .nav{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line);padding-bottom:18px}
    .navgroup{display:inline-block;vertical-align:top;min-width:210px}
    .grid{grid-template-columns:1fr;gap:36px}
    .rail{position:static}
    .stations{grid-template-columns:1fr}
    .link{flex-direction:row;align-items:center;gap:12px;padding:14px 0;min-width:0}
    .link .rule{flex:1;margin-top:0}
    .link .rule::after{display:none}
    .link .word{margin-top:0}
    .scenes,.versus{grid-template-columns:1fr}
    .versus .a{border-right:none;border-bottom:1px solid var(--line)}
    .station p{max-width:none}
    .wrap{padding:0 22px 64px}
  }
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
  @media print{
    .nav,.pager,.howto,.startline{display:none}
    body{background:#fff;color:#111}
    .shell{display:block}
    .guardrail,.tradition,.clockwarn,.card,.scene,.fact{background:#fff}
  }
</style>

<div class="shell">
  <nav class="nav" id="nav"></nav>
  <main class="main" id="main"></main>
</div>
<noscript><div class="wrap" style="padding-top:40px"><h1>The Twelve</h1><p class="hook">This leader&rsquo;s console needs JavaScript to run. The full written guides live in the vault folder <b>D Group - The Twelve/</b>.</p></div></noscript>

<script>
var S = [];
S.push({
n:1, slug:'peter', name:'Simon Peter', group:1,
sub:'Simon, son of John &middot; called Cephas, the Rock',
hook:'The man who failed loudest and was restored fully &mdash; living proof that Jesus builds his church on <em>forgiven</em> people, not flawless ones.',
essence:'The man who failed loudest and was restored fully.',

prep:[

 'Tonight&rsquo;s job is to let the group feel that, then turn their eyes from Peter&rsquo;s instability to Christ&rsquo;s faithfulness.',
 '<b>The trap to avoid:</b> &ldquo;Be bold like Peter.&rdquo; Peter&rsquo;s boldness is exactly what failed him on the night of the denial. The lesson is not Peter&rsquo;s courage &mdash; it is <em>Jesus&rsquo;s grip on Peter</em>: &ldquo;I have prayed for you that your faith may not fail&rdquo; (Luke 22:32). Keep returning there.'
],
scenes:[
 {tag:'Matt 16:16, 22', head:'Always first to speak', body:'First to confess Christ, first to object to the cross. First to volunteer at the Transfiguration <q>not knowing what he said.</q> First out of the boat.'},
 {tag:'Matt 14:28&ndash;31', head:'Big faith, big failure, one scene', body:'He alone walks on water &mdash; then sinks, crying <q>Lord, save me!</q> He swears he will die with Jesus, then denies him hours later.'},
 {tag:'John 13:8&ndash;9', head:'All-or-nothing, never halfway', body:'At the footwashing he refuses outright, then swings to the opposite pole: <q>not my feet only but also my hands and my head!</q> Measured restraint was not in his repertoire.'},
 {tag:'John 18:10 &middot; 6:68', head:'Physical, protective, tender', body:'He draws a sword in Gethsemane and takes off Malchus&rsquo;s ear. He is also the one who says <q>Lord, to whom shall we go? You have the words of eternal life.</q>'}
],
leadernote:'Resist the urge to make Peter a cautionary tale about being &ldquo;too much.&rdquo; His intensity is what Jesus <em>worked with</em>, not against. The issue was never his fire; it was where his confidence sat.',
versus:{
 aK:'What Peter got right', aQuote:'&ldquo;You are the Christ, the Son of the living God.&rdquo;',
 aBody:'Matt 16:16, and Jesus says the revelation came from the Father himself. He nailed the <em>who</em>.',
 bK:'What he completely missed', bQuote:'&ldquo;Get behind me, Satan&hellip; you are not setting your mind on the things of God.&rdquo;',

down:'Right about the identity. Wrong about the mission. That gap set up the denial.',
after:'A second blind spot surfaces after Pentecost: Peter still assumed the gospel was for Jews. It took a rooftop vision and the Spirit falling on Cornelius&rsquo;s household for him to say &ldquo;God shows no partiality&rdquo; (Acts 10:34). Even then he wobbled &mdash; Paul confronted him at Antioch (Gal 2:11&ndash;14). Yet at the Jerusalem council it was Peter who stood and testified that God made no distinction (Acts 15:8&ndash;9). <b>Peter&rsquo;s growth was real but not finished &mdash; which is honest, and a relief.</b>',
contribution:[
 {dt:'Leader of the early church', dd:'&ldquo;On this rock I will build my church,&rdquo; and the keys of the kingdom (Matt 16:18&ndash;19). After the resurrection he steps into exactly that role.'},
 {dt:'Pentecost', dd:'The man who denied Christ to a servant girl preaches to thousands fifty days later; about three thousand are added (Acts 2:41). Boldness finally anchored in the right place.'},
 {dt:'The door to the Gentiles', dd:'Through Peter at Cornelius&rsquo;s house the gospel crosses the Jew/Gentile line (Acts 10) &mdash; arguably the hinge of the whole book of Acts.'},
 {dt:'Scripture', dd:'1 and 2 Peter. The restored shepherd hands on his own commission to the elders: shepherd the flock, not domineering but as examples (1 Pet 5:2&ndash;3). &ldquo;Feed my sheep,&rdquo; passed down.'}
],
tradition:'<b>Mark&rsquo;s Gospel as Peter&rsquo;s eyewitness testimony</b>, written down by his companion Mark &mdash; <b>tradition, not Scripture</b> (from Papias, early 2nd century). His death: crucified in Rome under Nero, asking to be crucified upside down as unworthy to die as his Lord did &mdash; <b>tradition, not Scripture</b>. What Scripture does say is that Jesus foretold Peter would glorify God by his death, stretching out his hands (John 21:18&ndash;19).',
guardrail:{
 speech:'This is <em>not</em> a &ldquo;be more reliable than Peter&rdquo; lesson. Peter&rsquo;s reliability is the thing that failed. Look at the order: before Peter ever proves himself, Jesus restores him and re-commissions him. The grace comes <em>first</em>. And remember &mdash; back in Luke 22, before the denial even happened, Jesus had already said, <em>I have prayed for you that your faith may not fail.</em> Peter came back not because he was strong, but because Jesus prayed for him and came looking for him on that beach. That is the gospel. Jesus does the same for you.',
 foot:'<b>Indicative before imperative.</b> The call (&ldquo;Follow me,&rdquo; 21:19) lands only after the grace (&ldquo;Do you love me / feed my sheep&rdquo;). We do not earn the restoration by following; we follow <b>out of</b> a restoration already given. And note the detail worth slowing down on: Peter denied Jesus at a <b>charcoal fire</b> (John 18:18), and the risen Jesus builds a <b>charcoal fire</b> on the beach (John 21:9). The same word, found only these two places in the New Testament. Jesus deliberately recreates the scene of the failure in order to heal it.'
},
questions:[
 {lead:'Peter had huge faith and a huge failure in the same week.', rest:'Where do you notice that same mix in your own walk &mdash; moments of real boldness right next to real stumbling?'},
 {lead:'Jesus renamed Simon &ldquo;Rock&rdquo; before he acted like one (John 1:42).', rest:'What does it do to you that Jesus calls you by who you will become in him, not just who you have been?'},
 {lead:'Peter denied Jesus by a charcoal fire and was restored by another one.', rest:'Has Jesus ever met you right at the scene of a failure? What was that like &mdash; or what would it mean if he did?'},
 {lead:'Jesus asked &ldquo;Do you love me?&rdquo; &mdash; not &ldquo;Are you sorry?&rdquo; or &ldquo;Will you do better?&rdquo;', rest:'Why do you think he led with love? What does that reveal about how Jesus restores people?', land:true},
 {lead:'&ldquo;Feed my sheep&rdquo; was a job given to a man fresh off a bad failure.', rest:'Where might Jesus be calling you to serve out of restored grace rather than a proven track record &mdash; and what is holding you back from believing you are qualified?', land:true}
],
couples:'Is there a place you have written off your spouse (or yourself) the way Peter probably wrote himself off after the denial? What would it look like to extend the kind of restoration Jesus extended?',
dry:'<em>&ldquo;What is the most Peter thing you have ever done?&rdquo;</em> It gets laughter and lowers the guard for the honest answers.',
takeaway:'&ldquo;Jesus builds his church on forgiven people. Your failures are not the end of your usefulness &mdash; in his hands, they are often the <b>beginning</b> of it.&rdquo;',
prayer:'Thank Jesus that our standing rests on his faithfulness, not ours &mdash; that he prays for us when our faith is failing, and comes looking for us at the scene of our worst moments. Ask him to make the group people who, like Peter, are restored <em>and sent</em>.',
readaloud:'<b>Read at 0:08, back to back:</b> Luke 5:1&ndash;11, then John 21:15&ndash;19. The call and the restoration in one sitting lets the group hear the whole arc before you teach it &mdash; same lake, same nets, same man, three years apart.',
anchors:[
 {ref:'Luke 5:1&ndash;11', note:'the call; &ldquo;depart from me, I am a sinful man&rdquo;'},
 {ref:'Matt 16:13&ndash;23', note:'the confession, then the rebuke'},
 {ref:'Matt 14:28&ndash;31', note:'walking on water, then sinking'},
 {ref:'Luke 22:31&ndash;34, 54&ndash;62', note:'&ldquo;I have prayed for you&rdquo;; the denial'},
 {ref:'John 21:15&ndash;19', note:'the charcoal fire and the restoration'},
 {ref:'Acts 2:14&ndash;41', note:'Pentecost; three thousand added'}
],
glance:[
 {dt:'Names', dd:'Simon / Simeon &middot; Cephas (Aramaic) &middot; Peter (Greek <i>Petros</i>, rock)'},
 {dt:'Home &amp; trade', dd:'Bethsaida, later Capernaum. Fisherman in partnership with Zebedee&rsquo;s sons. <span class="note">Married &mdash; Mark 1:30; 1 Cor 9:5</span>'},
 {dt:'Standing', dd:'Inner three with James and John. Spokesman of the Twelve. The council called him uneducated and common (Acts 4:13).'},
 {dt:'Wrote', dd:'1 and 2 Peter. <span class="note">Likely the source behind Mark&rsquo;s Gospel (tradition)</span>'}
]
});
S.push({
n:2, slug:'andrew', name:'Andrew', group:1,
sub:'Simon Peter&rsquo;s brother &middot; the man who brought the rock',
hook:'The quiet connector who always brings people to Jesus &mdash; faithfulness is measured by <em>who you get to Christ</em>, not by how big your platform is.',
essence:'The quiet connector who always brings people to Jesus.',
spine:[
 {ref:'John 1:41&ndash;42 &middot; a brother', head:'He brought Peter', body:'His first recorded act as a follower: he goes and finds Simon. &ldquo;We have found the Messiah&hellip; He brought him to Jesus.&rdquo; Before Andrew does anything else, he hands Jesus the man who will lead the church.'},
 {ref:'John 6:8&ndash;9 &middot; a boy&rsquo;s lunch', head:'He brought something small', body:'In a crowd of five thousand he spots five barley loaves and two fish, and says out loud &ldquo;but what are they for so many?&rdquo; He is not sure it matters. He brings it anyway.'},
 {ref:'John 12:20&ndash;22 &middot; outsiders', head:'He brought the Greeks', body:'&ldquo;Sir, we wish to see Jesus.&rdquo; No turf, no gatekeeping, no screening the strangers out. He treats an outsider&rsquo;s interest in Jesus as something to carry straight to Jesus.'}
],
links:['Then the small','Then the outsider'],
prep:[
 'Andrew is the perfect disciple to follow Peter, because he is the <b>opposite kind of man and the same kind of useful.</b> Where Peter is loud, first, and famous, Andrew is quiet, second, and largely overlooked &mdash; and yet every single time the Gospels show him, he is doing one thing: <b>bringing someone to Jesus.</b> He brings his brother, he brings a boy&rsquo;s lunch, he brings the outsiders.',
 'Tonight&rsquo;s job is to let the unsung people in the room &mdash; the ones who will never preach to thousands like Peter &mdash; see that Jesus delights to use the overshadowed, and that introducing people to Christ is real, frontline kingdom work.',
 '<b>The trap to avoid:</b> &ldquo;Be a connector like Andrew.&rdquo; That subtly turns Andrew into a personality type to imitate, and quietly tells half the room they are failing at networking. The lesson is not Andrew&rsquo;s social gift &mdash; it is that <em>Andrew&rsquo;s whole significance is borrowed from the One he brings people to.</em> Keep the spotlight on Jesus, the destination, not Andrew, the usher.'
],
scenes:[
 {tag:'John 1:41&ndash;42', head:'He brings people instinctively', body:'His first recorded act as a follower is fetching his brother. It is not a strategy. It is a reflex.'},
 {tag:'John 12:20&ndash;22', head:'He is unterritorial', body:'When the Greeks come asking for Jesus, Andrew does not guard access or try to look important. He and Philip simply take them to Jesus.'},
 {tag:'John 6:9', head:'He notices the overlooked', body:'In a crowd of thousands he is the one who spots a boy with a small lunch and brings it forward &mdash; even while saying <q>but what are they for so many?</q>'},
 {tag:'John 1:40 &middot; 6:8', head:'He is content in the shadows', body:'He is forever introduced as <q>Simon Peter&rsquo;s brother.</q> The Gospels never record him fighting for the spotlight his brother had.'}
],
leadernote:'Resist reading Andrew as merely &ldquo;shy&rdquo; or &ldquo;the quiet one.&rdquo; His quietness isn&rsquo;t timidity &mdash; it&rsquo;s a settled, unanxious willingness to point away from himself and toward Jesus. <em>That is not a smaller faith than Peter&rsquo;s. It is a differently-shaped one Jesus used just as fully.</em>',
versus:{
 aK:'What the room assumes counts', aQuote:'&ldquo;Simon Peter&rsquo;s brother.&rdquo;',
 aBody:'Andrew has almost no story of his own. No Andrew sermon, no Andrew letter, no Andrew leadership moment. He was never part of the inner three &mdash; Peter, James and John get the Transfiguration, Jairus&rsquo;s daughter, Gethsemane. Andrew does not.',
 bK:'What actually counted', bQuote:'&ldquo;He first found his own brother Simon&hellip; He brought him to Jesus.&rdquo;',
 bBody:'Every soul reached through Peter traces back, humanly speaking, to <em>a brother who simply went and got him.</em> The most strategic thing in the early church may have been one quiet introduction nobody applauded.'
},
down:'Get people to Jesus and let Jesus do the rest.',
after:'Andrew seems to have grasped something early that took the others longer: <b>discipleship is personal introduction.</b> He saw following Jesus less as a position to hold and more as a person to share. And notice he didn&rsquo;t only connect the prominent. He connected the <b>small</b> (a boy&rsquo;s lunch) and the <b>outsider</b> (the Greeks). He didn&rsquo;t need to be the answer &mdash; he just needed to know where the answer was.',
contribution:[
 {dt:'He brought Peter', dd:'This is the headline. The man who preached at Pentecost, opened the door to the Gentiles, and was called the rock &mdash; Andrew brought him to Jesus first (John 1:41&ndash;42).'},
 {dt:'The Bible&rsquo;s model connector', dd:'Three scenes, three introductions: his brother, the boy, the Greeks. The clearest New Testament picture of personal evangelism &mdash; not preaching to crowds, but one person at a time.'},
 {dt:'Patron of the overlooked', dd:'Proof that you do not need a platform to be of enormous consequence in the kingdom.'},
 {dt:'First to follow', dd:'He began as a disciple of John the Baptist, and left him the moment John said &ldquo;Behold, the Lamb of God&rdquo; (John 1:35&ndash;40).'}
],
tradition:'After Pentecost Andrew preached around <b>Scythia and Greece</b> and was crucified at <b>Patras</b> on an X-shaped cross &mdash; the St. Andrew&rsquo;s Cross &mdash; later becoming patron saint of <b>Scotland and Russia</b>. <b>All tradition, not Scripture.</b> The New Testament tells us nothing of his life after Acts 1:13.',
guardrail:{
 speech:'This is <em>not</em> a &ldquo;be a better connector than Andrew&rdquo; lesson. If you walk out of here tonight just feeling guilty that you do not invite enough people to church, I have taught it wrong. Look at what actually makes Andrew matter: it is not Andrew at all &mdash; it is Jesus, the one he brings people to. Andrew&rsquo;s life is small and borrowed and pointed entirely away from himself, and Jesus made it count forever. That is grace. Jesus delights to use the overshadowed, the second-fiddle, the ones nobody films. You do not have to become impressive to be useful to him. You just have to know where Jesus is and be willing to point. He does the same with you that he did with Andrew &mdash; he takes a quiet, ordinary life and makes an eternal difference through it.',
 foot:'<b>Indicative before imperative.</b> The reason we bring people to Jesus is not to earn significance &mdash; it is that Jesus is <em>worth</em> bringing people to, and he has already made our small offerings matter. We point <b>out of</b> a grace already given, not to prove our worth. The whole value of an usher is the room he gets you into. The whole value of a signpost is the destination it points at.'
},
questions:[
 {lead:'Andrew spent his life in the shadow of his more famous brother.', rest:'How do you handle being the lesser-known one in a family, a job, or a friendship?'},
 {lead:'Every time we meet Andrew, he is bringing someone to Jesus.', rest:'Who first brought <em>you</em>? And who might you be an Andrew to right now?'},
 {lead:'Andrew offered a boy&rsquo;s small lunch, unsure it even mattered (John 6:9).', rest:'What small thing have you hesitated to offer because it felt too little to bother with?'},
 {lead:'Where are you tempted to measure your worth by visibility', rest:'&mdash; by how seen or impressive you are &mdash; rather than by faithfulness?', land:true},
 {lead:'What would actually change this week', rest:'if you saw introducing people to Jesus as your main job, the way Andrew did?', land:true}
],
couples:'In your marriage, is there a quiet, Andrew role one of you carries that rarely gets noticed or thanked? Take a minute to name it out loud for each other &mdash; and ask whether you have been measuring each other by platform instead of faithfulness.',
dry:'<em>&ldquo;Who is the most behind-the-scenes person you know who actually holds everything together &mdash; and does anyone ever thank them?&rdquo;</em> It surfaces the unsung-faithfulness theme fast, and usually someone in the room <b>is</b> that person.',
takeaway:'&ldquo;You don&rsquo;t need a platform to be of eternal consequence. Andrew&rsquo;s whole job was <b>knowing where Jesus was and bringing people to him</b> &mdash; and Jesus is honored to do the very same thing through your quiet, ordinary life.&rdquo;',
prayer:'Close in prayer. Thank Jesus that he uses the overshadowed and the unseen, that no offering brought to him is too small to matter, and that our significance rests not on our visibility but on who we belong to. Ask him to make the group people who, like Andrew, instinctively bring others to Christ &mdash; and who are content to let him be the One everyone remembers.',
readaloud:'<b>Read at 0:08, back to back:</b> John 1:35&ndash;42 (Andrew follows Jesus and immediately goes to get his brother), then John 6:8&ndash;9 (Andrew points out the boy with the loaves and fish). Reading these together lets the group hear Andrew&rsquo;s signature move twice &mdash; bringing a <em>person</em>, then bringing a <em>small offering</em> &mdash; before you teach it.',
anchors:[
 {ref:'John 1:35&ndash;42', note:'follows Jesus, then brings his brother'},
 {ref:'Mark 1:16&ndash;18 &middot; Matt 4:18&ndash;20', note:'called from the nets; immediately they left them'},
 {ref:'John 6:8&ndash;9', note:'the boy with five loaves and two fish'},
 {ref:'John 12:20&ndash;22', note:'brings the inquiring Greeks to Jesus'},
 {ref:'Acts 1:13', note:'the last mention of him in Scripture'}
],
glance:[
 {dt:'Name', dd:'Andrew, Greek <i>Andreas</i>, &ldquo;manly&rdquo; <span class="note">&mdash; always introduced as Simon Peter&rsquo;s brother</span>'},
 {dt:'Home &amp; trade', dd:'Bethsaida (John 1:44); fisherman on the Sea of Galilee. A common working man, not a scholar.'},
 {dt:'Started with the Baptist', dd:'One of John the Baptist&rsquo;s disciples, among the first to follow Jesus. <span class="note">Not part of the inner three</span>'},
 {dt:'Three signature scenes', dd:'Brings Peter (John 1) &middot; brings the boy&rsquo;s lunch (John 6) &middot; brings the Greeks (John 12)'}
]
});
S.push({
n:3, slug:'james-zebedee', name:'James, son of Zebedee', group:1,
sub:'Son of Thunder &middot; first of the Twelve to die',
hook:'Raw ambition refined. Jesus didn&rsquo;t crush James&rsquo;s drive &mdash; he <em>redirected</em> it, from a throne to a cup.',
essence:'Ambition refined. The first apostle martyred.',
spine:[
 {ref:'Mark 10:37 &middot; the ask', head:'He asked for a throne', body:'&ldquo;Grant us to sit, one at your right hand and one at your left, in your glory.&rdquo; Unembarrassed, and on the record.'},
 {ref:'Mark 10:38, 43&ndash;45 &middot; the hinge', head:'He was handed a cup', body:'&ldquo;Are you able to drink the cup that I drink?&rdquo; Not a rebuke of the hunger. A new aim for it: whoever would be great must serve.'},
 {ref:'Acts 12:1&ndash;2 &middot; the cup arrives', head:'He drank it first', body:'Herod killed him with the sword. The man who said &ldquo;We are able&rdquo; proved it &mdash; and got the place beside Jesus he had asked for.', cost:true}
],
links:['Jesus redirects','c. AD 44'],
prep:[
 'James is the right disciple for the night after Andrew because he is Andrew&rsquo;s opposite number and a different kind of mirror. Where Andrew quietly brought people to Jesus, James wanted a throne. He is the ambitious one &mdash; intense, zealous, hungry for greatness &mdash; and <b>Jesus chose him on purpose</b>, named his fire &ldquo;thunder,&rdquo; then spent three years pointing that drive somewhere new.',
 'Nearly everyone in the room carries some version of James&rsquo;s hunger: to matter, to win, to be near the top. Tonight&rsquo;s job is to let the group feel that drive named honestly, then watch Jesus do what he does with it &mdash; not delete it, but re-aim it.',
 '<b>The trap to avoid:</b> &ldquo;Be ambitious and bold like James.&rdquo; That gets it exactly backward. His ambition is the thing Jesus had to <em>redirect</em>; he asked for glory and was offered suffering. The lesson is not James&rsquo;s drive &mdash; it is where Jesus aimed it. <b>The drive isn&rsquo;t the problem. Its direction is.</b>'
],
scenes:[
 {tag:'Mark 3:17', head:'Jesus names the voltage', body:'<q>Boanerges</q> &mdash; Sons of Thunder. Not a name for what was wrong with them. A name for the raw material he intended to use.'},
 {tag:'Luke 9:54&ndash;55', head:'Fire on the Samaritans', body:'A village will not receive Jesus, so James asks whether to call down fire. Jesus <q>turned and rebuked them.</q> Thunder unaimed: real devotion, wrong target.'},
 {tag:'Mark 10:37', head:'The seats, out loud', body:'He and John want the top two places in the kingdom &mdash; and they want it on the record. It made the other ten indignant.'},
 {tag:'Mark 10:38&ndash;39', head:'&ldquo;We are able&rdquo;', body:'Asked whether he can drink the cup, James does not flinch. He does not yet grasp what the cup is &mdash; but that same fearlessness put him first in line at the sword.'}
],
leadernote:'Resist making James a cautionary tale about being &ldquo;too ambitious.&rdquo; His drive is what Jesus <em>worked with</em>, not against &mdash; Jesus picked him for the inner three. The issue was never the size of his fire; it was the direction he was pointing it.',
versus:{
 aK:'What James pictured', aQuote:'&ldquo;Grant us to sit, one at your right hand and one at your left, in your glory.&rdquo;',
 aBody:'Not a crazy hope &mdash; Jesus <em>had</em> promised the Twelve would sit on thrones (Matt 19:28). James simply assumed the road there ran upward: position, status, rank.',
 bK:'What Jesus offered', bQuote:'&ldquo;You do not know what you are asking. Are you able to drink the cup that I drink?&rdquo;',
 bBody:'In Scripture the cup is suffering. He asked for a crown and was handed a cup &mdash; then given the kingdom&rsquo;s deepest logic: <em>whoever would be great among you must be your servant.</em>'
},
down:'In the kingdom, the way up is down.',
after:'This is honest territory for a small group. Most of us are some mix of James &mdash; we want the reward and would just as soon skip the cost. <b>Jesus doesn&rsquo;t shame the desire to be near him.</b> He just keeps telling the truth about what the path actually is.',
contribution:[
 {dt:'Inner-circle eyewitness', dd:'Jairus&rsquo;s house (Mark 5:37), the Transfiguration (Matt 17:1&ndash;8), Gethsemane (Mark 14:33). He saw the glory and the agony up close.'},
 {dt:'First apostle to die', dd:'Herod Agrippa I killed him with the sword, c. AD 44 (Acts 12:1&ndash;2). Of all the Twelve, James paid first.'},
 {dt:'A word of Jesus fulfilled', dd:'&ldquo;The cup that I drink you will drink&rdquo; (Mark 10:39). His death is that cup arriving, exactly as Jesus said.'},
 {dt:'A pattern for the rest', dd:'He wrote no letter and opened no door to the Gentiles. His contribution was his life.'}
],
tradition:'Later traditions place James in Spain before his death. <b>Tradition, not Scripture</b> &mdash; and historically thin. Best left aside. Two inferences worth naming honestly too: he was <em>likely</em> the older brother of John (from name order, always &ldquo;James and John&rdquo;), and his mother was <em>likely</em> Salome (from the women named at the cross, Mark 15:40 and Matt 27:56). Reasonable inferences, not stated facts.',
guardrail:{
 speech:'This is <em>not</em> a &ldquo;go be more ambitious and bold like James&rdquo; lesson. James&rsquo;s raw ambition, pointed at a throne, is the thing Jesus had to redirect. Look at what Jesus actually does: he does not kill the drive, and he does not reward the power-grab &mdash; he aims the hunger at a cup and calls it greatness. And notice the order. Before James ever drank that cup, Jesus had already drunk his &mdash; <em>the Son of Man came to give his life as a ransom for many.</em> Jesus goes to the cross first; only then does James follow. The same Jesus who took James&rsquo;s misaimed ambition and redirected it toward something real does the exact same thing with the drive in you. He does not ask you to want less. He asks to aim it.',
 foot:'<b>Indicative before imperative.</b> The call to drink the cup (10:39) only makes sense because Jesus drinks his cup first and gives his life as the ransom (10:45). We do not suffer our way to a seat beside Jesus &mdash; we follow <b>out of</b> a place he already secured for us at the cross. And the grace hiding in plain sight: <b>James got exactly what he asked for.</b> He wanted a place next to Jesus, and he received it &mdash; not by lording it over the other ten, but by being first of them to share his cup.'
},
questions:[
 {lead:'James asked for the glory; Jesus offered him the cup (Mark 10:37&ndash;38).', rest:'Where in your own life have you wanted the reward without the cost?'},
 {lead:'Jesus redirected the ambition rather than killing it.', rest:'What God-given drive in you needs re-aiming more than suppressing?'},
 {lead:'&ldquo;Son of Thunder&rdquo; was a real, named trait (Mark 3:17).', rest:'What is the thunder in you &mdash; your intensity, your edge? And right now, is Jesus using it or taming it?'},
 {lead:'James was first of the Twelve to die for Jesus (Acts 12:2).', rest:'What would following Jesus actually cost you this year &mdash; and are you willing?', land:true},
 {lead:'James and John served side by side as brothers.', rest:'Who is your partner in the work &mdash; and how are the two of you sharpening each other?', land:true}
],
couples:'James and John were family pulling in the same direction, most of the time. Where are you and your spouse aiming your shared thunder at the same goal &mdash; and where is one of you asking for a throne while the other is being handed a cup? What would it look like to want greatness the way Jesus defined it, together?',
dry:'<em>&ldquo;If you could pick any seat in any room &mdash; the boardroom, the platform, the head of the table &mdash; which one have you secretly wanted? Now ask: why that one?&rdquo;</em> It surfaces the throne-hunger honestly and lowers the guard before question 1.',
takeaway:'&ldquo;Jesus doesn&rsquo;t ask you to want less. He asks you to <b>aim it.</b> The drive isn&rsquo;t the problem &mdash; its direction is.&rdquo;',
prayer:'Close in prayer. Thank Jesus that he goes to the cross first, drinking his cup so that any cup we are handed is one he has already walked through ahead of us. Ask him to take the drive in each person in the room, name it honestly, and aim it at real greatness: serving, following, and being near him whatever it costs.',
readaloud:'<b>Read at 0:08, back to back:</b> Mark 10:35&ndash;45, then Acts 12:1&ndash;2. The request and the death in one sitting lets the room hear the whole arc at once &mdash; the man who asked to sit in glory became the first to drink the cup. Same man, same drive, pointed all the way through.',
anchors:[
 {ref:'Mark 1:19&ndash;20', note:'the call; they leave the boat, the nets, and their father'},
 {ref:'Mark 3:17', note:'Boanerges, Sons of Thunder'},
 {ref:'Luke 5:10', note:'the family fished in partnership with Simon Peter'},
 {ref:'Luke 9:51&ndash;56', note:'fire on the Samaritans'},
 {ref:'Mark 10:35&ndash;45', note:'the thrones, the cup, and true greatness'},
 {ref:'Matt 17:1&ndash;8', note:'the Transfiguration'},
 {ref:'Acts 12:1&ndash;2', note:'killed by the sword, c. AD 44'}
],
glance:[
 {dt:'Name', dd:'James, son of Zebedee <span class="note">&mdash; Son of Thunder, with his brother John</span>'},
 {dt:'Home &amp; trade', dd:'Sea of Galilee; commercial fisherman. Zebedee employed hired servants (Mark 1:20).'},
 {dt:'Inner three', dd:'With Peter and John &mdash; Jairus, the Transfiguration, Gethsemane.'},
 {dt:'Death', dd:'Killed by Herod Agrippa I&rsquo;s sword, c. AD 44. First of the Twelve to be martyred.'}
]
});
S.push({
n:4, slug:'john', name:'John', group:1,
sub:'Son of Zebedee &middot; the disciple whom Jesus loved',
hook:'Thunder transformed into love &mdash; a Son of Thunder who wanted to call down fire became the apostle who could write <em>God is love.</em>',
essence:'Thunder transformed into love.',
spine:[
 {ref:'Luke 9:54 &middot; the young man', head:'He wanted to burn a village', body:'A Samaritan town will not receive Jesus, so John asks whether to call down fire on it. Jesus turns and rebukes him.'},
 {ref:'John 13:23 &middot; the table', head:'He leaned on Jesus instead', body:'At the Last Supper he is reclining at Jesus&rsquo;s side, literally leaning back against him. The man who wanted the seat of power is found in the seat of closeness.'},
 {ref:'1 John 4:19 &middot; the old apostle', head:'&ldquo;We love because he first loved us&rdquo;', body:'Decades later the ladder is gone entirely. Love is the response, never the effort. Same man, a lifetime of Jesus in between.'}
],
links:['Decades of Jesus','The overflow'],
prep:[
 'John is the clearest picture in the Twelve of <b>slow, grace-driven transformation.</b> He does not change in a single dramatic scene the way Peter does on the beach &mdash; he changes over <em>decades</em>. The fiery young man who wanted to incinerate a Samaritan village is the same man who, as an old apostle, kept repeating &ldquo;little children, love one another.&rdquo;',
 'That arc is hope for anyone in the room who feels like they are changing too slowly. Tonight&rsquo;s job is to let the group watch Jesus do patient, long work in a hot-tempered man &mdash; and to make sure they see that the love John ended up famous for was always a <em>response</em>, never an achievement.',
 '<b>The trap to avoid:</b> &ldquo;Love more like John by trying harder.&rdquo; This is the exact mistake. John never tried his way into love &mdash; he <em>received</em> it for decades until it remade him. His own name for himself was &ldquo;the disciple whom Jesus loved.&rdquo; Keep returning to his anchor verse: <b>we love because he first loved us</b> (1 John 4:19). The love comes second. The being-loved comes first.'
],
scenes:[
 {tag:'Mark 3:17', head:'Hot-tempered by name', body:'Jesus nicknamed James and John <q>Boanerges, Sons of Thunder</q> &mdash; a name you do not earn by being mild.'},
 {tag:'Luke 9:54&ndash;55', head:'Ready to call down fire', body:'When a Samaritan village will not receive Jesus, John asks, <q>Lord, do you want us to tell fire to come down from heaven and consume them?</q> Jesus <q>turned and rebuked them.</q>'},
 {tag:'Mark 9:38&ndash;40', head:'Exclusive and territorial', body:'<q>We saw someone casting out demons in your name, and we tried to stop him, because he was not following us.</q> Jesus: <q>Do not stop him&hellip; the one who is not against us is for us.</q>'},
 {tag:'Mark 10:37', head:'Ambitious', body:'With James, and through their mother (Matt 20:20&ndash;21), he asks for the two best seats <q>in your glory.</q> It made the other ten indignant.'}
],
leadernote:'Don&rsquo;t soften young John into a misunderstood sweetheart. He really was zealous, status-hungry, and quick to draw lines. The point isn&rsquo;t that John was secretly nice all along &mdash; it&rsquo;s that Jesus took a genuinely combustible personality and, over a long time, turned the heat into warmth. <em>Same fire, redirected.</em>',
versus:{
 aK:'Early John: greatness as a ladder', aQuote:'&ldquo;Teacher, we tried to stop him, because he was not following us.&rdquo;',
 aBody:'Burn the village that rejects Jesus, shut down the outsider doing ministry the wrong way, secure the throne seat. He wanted to be <em>near the top</em> and to put down what threatened him.',
 bK:'Old John: love as the whole framework', bQuote:'&ldquo;Beloved, let us love one another, for love is from God&hellip; God is love.&rdquo;',
 bBody:'And he never grounds it in human effort: <em>in this is love, not that we have loved God but that he loved us and sent his Son to be the propitiation for our sins</em> (1 John 4:10).'
},
down:'The man who wanted the seat of power was found in the seat of closeness.',
after:'<b>John&rsquo;s growth was real, slow, and entirely Jesus&rsquo;s doing</b> &mdash; which is honest, and a relief for anyone who feels stuck. Watch the quiet repositioning at the table: John is reclining at Jesus&rsquo;s side, and it is John that Peter signals to ask Jesus the hard question (John 13:23&ndash;25). That is the whole movement of his life in one image.',
contribution:[
 {dt:'The eyewitness Gospel', dd:'The most theologically rich and personal of the four, written so that &ldquo;you may believe that Jesus is the Christ&hellip; and that by believing you may have life in his name&rdquo; (John 20:31).'},
 {dt:'The letters of assurance', dd:'1, 2 and 3 John &mdash; short, pastoral, repetitive on purpose: love one another, and &ldquo;that you may know that you have eternal life&rdquo; (1 John 5:13). Written to give ordinary believers confidence, not anxiety.'},
 {dt:'Revelation', dd:'Written &ldquo;on the island called Patmos on account of the word of God&rdquo; (Rev 1:9) &mdash; a vision of the risen, reigning Christ given to a faithful old man in exile.'},
 {dt:'He cared for Mary', dd:'From the cross Jesus entrusted his own mother to John: &ldquo;Behold, your mother!&rdquo; And from that hour the disciple took her to his own home (John 19:26&ndash;27). The legacy is not only what he wrote &mdash; it is who he carried.'}
],
tradition:'John ministered for many years at <b>Ephesus</b>, was exiled to <b>Patmos</b>, and died of old age &mdash; the only one of the Twelve not martyred. <b>Tradition, not Scripture</b>, though the Patmos exile itself is stated in Rev 1:9. Also tradition: that as a very old man he kept saying, &ldquo;Little children, love one another,&rdquo; because &ldquo;it is the Lord&rsquo;s command, and if this only is done, it is enough.&rdquo;',
guardrail:{
 speech:'This is <em>not</em> a &ldquo;be more loving than you are, try harder, white-knuckle your temper&rdquo; lesson. That is the very thing John never did. Look at the order of his own sentence: <em>we love because he first loved us.</em> The being-loved comes first; the loving comes second, as the overflow. John&rsquo;s secret was not his effort &mdash; it was his name for himself: <em>the one Jesus loves.</em> If you walked out of here tonight just trying to love more, you would be doing the opposite of what John did. The invitation is to do what he did &mdash; to rest in being loved by Jesus until that love starts to leak out of you. He loves you the same way he loved John.',
 foot:'<b>Indicative before imperative.</b> &ldquo;Love one another&rdquo; (the command) only ever lands <em>after</em> &ldquo;God is love&hellip; he first loved us&rdquo; (the gift). We don&rsquo;t manufacture the love; we receive it, and it remakes us &mdash; slowly, like it did John. And notice what he could have called himself: Son of Thunder, son of Zebedee, one of the inner three, the last surviving apostle, the man who stood at the cross. <b>Instead, every time, he reaches for &ldquo;the one Jesus loves.&rdquo;</b> Not &ldquo;the one who loved Jesus best.&rdquo; His whole identity rested on the direction of that love.'
},
questions:[
 {lead:'John went from wanting to call down fire to writing &ldquo;God is love.&rdquo;', rest:'What slow transformation has Jesus been working in you over years &mdash; something that is still in progress?'},
 {lead:'John&rsquo;s identity was &ldquo;the one Jesus loves.&rdquo;', rest:'If you actually introduced yourself that way, what would change about how you live this week?'},
 {lead:'At the cross, Jesus handed John a new responsibility &mdash; caring for Mary.', rest:'Who has God placed in your care that you did not choose? How are you carrying it?'},
 {lead:'John leaned on Jesus at the table.', rest:'What does unhurried closeness with Jesus look like in your week &mdash; and when did you last actually have it?', land:true},
 {lead:'John was still preaching &ldquo;love one another&rdquo; in old age.', rest:'What truth do you want to still be living out decades from now?', land:true}
],
couples:'John spent years simply receiving Jesus&rsquo;s love before it overflowed toward others. Where in your marriage are you running on empty &mdash; trying to love your spouse out of effort instead of out of being loved by Jesus first? What would it look like this week to receive before you try to give?',
dry:'<em>&ldquo;What is something about yourself you would love for Jesus to change &mdash; but that feels like it is taking forever?&rdquo;</em> It gives people permission to be a work in progress, which is exactly John&rsquo;s story.',
takeaway:'&ldquo;You don&rsquo;t become loving by trying harder &mdash; you become loving by <b>resting longer in being loved.</b> We love because he first loved us.&rdquo;',
prayer:'Close in prayer. Thank Jesus that he is not in a hurry with us &mdash; that he takes Sons of Thunder and, over a lifetime, makes them gentle. Thank him that our identity can be the same as John&rsquo;s: &ldquo;the one Jesus loves.&rdquo; Ask him to let the group rest in his love until it overflows &mdash; not to strive their way into a softness only he can grow.',
readaloud:'<b>Read at 0:08, back to back:</b> Luke 9:51&ndash;56 (the village John wanted to burn), then 1 John 4:7&ndash;12 (the love he later wrote about). Reading the fire passage and the &ldquo;God is love&rdquo; passage back to back lets the group hear the whole transformation in one sitting &mdash; same man, same heart, a lifetime of Jesus apart.',
anchors:[
 {ref:'Mark 1:19&ndash;20', note:'called with his brother James'},
 {ref:'Mark 3:17', note:'Boanerges, Sons of Thunder'},
 {ref:'Luke 9:54', note:'wants to call down fire'},
 {ref:'Mark 9:38', note:'tries to stop an outsider'},
 {ref:'John 13:23&ndash;25', note:'reclining at Jesus&rsquo;s side'},
 {ref:'John 19:26&ndash;27', note:'at the cross, given Jesus&rsquo;s mother'},
 {ref:'John 20:1&ndash;9', note:'the empty tomb; saw and believed'},
 {ref:'1 John 4:7&ndash;12, 19', note:'we love because he first loved us'},
 {ref:'Rev 1:9', note:'exiled on Patmos'}
],
glance:[
 {dt:'Names', dd:'John, son of Zebedee &middot; Son of Thunder &middot; <span class="note">the disciple whom Jesus loved</span>'},
 {dt:'Home &amp; trade', dd:'Galilee; fisherman in the family business with hired servants (Mark 1:20). Later ministry at Ephesus <span class="note">(tradition)</span>'},
 {dt:'Family', dd:'Brother of James, the previous session. Inner three with Peter and James.'},
 {dt:'Wrote', dd:'Gospel of John &middot; 1, 2 and 3 John &middot; Revelation, from exile on Patmos'}
]
});
S.push({
n:5, slug:'philip', name:'Philip', group:2,
sub:'Of Bethsaida &middot; the disciple who wanted to be shown',
hook:'The practical &ldquo;show me&rdquo; disciple Jesus kept stretching &mdash; and met not with a rebuke, but <em>with himself.</em>',
essence:'The practical show-me disciple Jesus stretched.',
warn:'<b>Get the name straight before you teach.</b> This is <b>Philip the apostle</b>, one of the Twelve. He is <b>NOT</b> Philip the Evangelist, the deacon chosen in Acts 6 who later preaches in Samaria and to the Ethiopian eunuch in Acts 8. Two different Philips, easy to confuse. If anyone brings up the Ethiopian eunuch, that is the <em>other</em> Philip. Tonight is the man Jesus called by the Jordan in John 1.',
spine:[
 {ref:'John 1:46 &middot; the instinct', head:'&ldquo;Come and see&rdquo;', body:'Nathanael pushes back &mdash; can anything good come out of Nazareth? Philip does not argue him into it or win the debate. He brings the skeptic to Jesus and lets Jesus do the rest.'},
 {ref:'John 6:7 &middot; the test', head:'He did the math instead', body:'Asked how to feed the crowd, he prices it: two hundred denarii, roughly eight months&rsquo; wages, and still not enough. The math was right. It was also completely beside the point.'},
 {ref:'John 14:8&ndash;9 &middot; the answer', head:'&ldquo;Whoever has seen me&rdquo;', body:'After three years he still asks to be shown the Father. Jesus does not perform a new sign. He points Philip back to himself as the evidence.'}
],
links:['Then the test','Then the gift'],
prep:[
 'Philip is the right disciple for the analytical, level-headed people in the room &mdash; the cost-counters, the &ldquo;let me see the numbers first&rdquo; believers. His faith is real but <b>bounded by the calculable</b>: he wants things demonstrated, shown, added up before he is all in. Across four scenes in John, Jesus keeps gently stretching that boundary.',
 'Tonight&rsquo;s job is to let the practical people in the room feel <em>seen</em>, and then show them where Jesus points the show-me heart &mdash; not to bigger faith, but to himself. The climax in John 14:9 is one of the most tender lines in the Gospels.',
 '<b>The trap to avoid:</b> &ldquo;Have more faith like Philip should have.&rdquo; That flips the point upside down. Philip&rsquo;s problem was never that he needed to <em>manufacture</em> more belief &mdash; it is that he kept looking for evidence <em>next to</em> Jesus when the evidence was standing in front of him. The line is never &ldquo;do the math better next time.&rdquo; It is <b>Christ himself is the evidence the practical heart is looking for.</b>'
],
scenes:[
 {tag:'John 6:7', head:'He thinks in numbers', body:'<q>Two hundred denarii worth of bread would not be enough for each of them to get a little.</q> Roughly eight months&rsquo; wages &mdash; and his point is that even that would not cover it. He sized up the problem before he sized up the One asking.'},
 {tag:'John 14:8', head:'He is literal', body:'Jesus has been speaking about the Father, and Philip takes it straight: <q>Lord, show us the Father, and it is enough for us.</q> He wants a concrete, visible demonstration.'},
 {tag:'John 1:46 &middot; 6:7 &middot; 14:8', head:'He wants to be shown', body:'Notice the pattern. With Nathanael, <q>come and see.</q> With the crowd, count the cost. With the Father, show us. Philip is constantly oriented toward evidence he can verify.'},
 {tag:'John 1:45 &middot; 12:21', head:'But he brings people in', body:'For all his caution, his reflex is to connect seekers to Jesus &mdash; Nathanael first, later the Greeks. Not a closed-off skeptic; a careful man who, once he has seen, cannot help bringing others to see.'}
],
leadernote:'Don&rsquo;t paint Philip as the &ldquo;weak faith&rdquo; disciple. His practicality is a <em>gift</em> &mdash; every group needs the person who asks the hard logistical question. The issue was never that he was too analytical; it was <em>where he aimed his analysis.</em> He kept measuring the problem instead of measuring the Person standing in front of him.',
versus:{
 aK:'What Philip kept asking for', aQuote:'&ldquo;Lord, show us the Father, and it is enough for us.&rdquo;',
 aBody:'An honest, almost wistful request &mdash; <em>just show me, and I will be satisfied.</em> The most honest prayer of a practical heart.',
 bK:'What Jesus actually said', bQuote:'&ldquo;Have I been with you so long, and you still do not know me, Philip? Whoever has seen me has seen the Father.&rdquo;',
 bBody:'Not a rebuke for being analytical. Not a new sign. The proof was not going to arrive later in a clearer form. <em>The proof was a Person, already given.</em>'
},
down:'He could ask the right question and look in the wrong direction.',
after:'At the feeding, John tells us something crucial: Jesus asked Philip how to feed the crowd <b>&ldquo;to test him, for he himself knew what he would do&rdquo;</b> (John 6:6). It was not a real request for a logistics plan. It was a test of where Philip would look &mdash; and Philip looked at the bank account. A relief for the room: <b>Jesus never shames Philip for it.</b> The show-me heart is not rebuked. It is answered.',
contribution:[
 {dt:'He brought Nathanael', dd:'His &ldquo;come and see&rdquo; (John 1:46) put one of the Twelve in front of Jesus. He did not win the argument; he made the introduction and trusted Jesus to do the convincing.'},
 {dt:'Contact point for the Greeks', dd:'In John 12 the seeking Greeks approach <em>Philip</em> &mdash; &ldquo;Sir, we wish to see Jesus.&rdquo; He does not act alone; he tells Andrew, and the two of them go to Jesus together.'},
 {dt:'Evangelism for ordinary people', dd:'Philip never has the eloquent answer. His whole ministry is &ldquo;come and see&rdquo; &mdash; bring the seeker, the skeptic, the outsider, and let them meet Jesus for themselves.'},
 {dt:'Always fifth on the list', dd:'He appears in every apostle list: Matt 10:3, Mark 3:18, Luke 6:14, Acts 1:13. His Greek name (<i>Philippos</i>, lover of horses) fits a mixed Greek-Jewish region &mdash; and may be why Greek-speaking inquirers sought him out.'}
],
tradition:'Philip&rsquo;s later ministry in <b>Phrygia</b> (Asia Minor), with martyrdom at <b>Hierapolis</b> &mdash; <b>tradition, not Scripture.</b> The New Testament tells us nothing about how Philip the apostle died. And say the other clarification out loud if it helps the room: the Philip who preaches to the Ethiopian eunuch in Acts 8 is a <em>different</em> Philip.',
guardrail:{
 speech:'This is <em>not</em> a &ldquo;figure out how to believe harder&rdquo; lesson. Philip did not need to manufacture faith &mdash; he needed to look in the right direction. He kept doing the math, counting the cost, asking to be shown, and the whole time the answer was the One standing in front of him. So hear this clearly: when your practical, realistic heart says <em>just show me, God, and I will trust you</em> &mdash; Jesus&rsquo;s answer is <em>himself.</em> Christ is the evidence the practical heart is looking for. You do not have to get the numbers to add up before you will trust him. You look at <em>him</em> &mdash; at who he is, what he did at the cross, that he came looking for you the way he came looking for Philip &mdash; and you find that he is already the proof you were waiting for.',
 foot:'<b>Indicative before imperative.</b> Jesus answers Philip&rsquo;s request with a <em>gift</em> &mdash; you have already seen the Father, because you have seen me &mdash; before he ever asks anything more of him. We don&rsquo;t earn the demonstration by believing harder; we trust <b>because</b> the demonstration has already been given in Christ. Worth noting too: Philip&rsquo;s call is unusual. Nobody brought him. <b>Jesus found Philip</b> and said &ldquo;Follow me&rdquo; (John 1:43).'
},
questions:[
 {lead:'Philip saw the hungry crowd and instantly did the discouraging math (John 6:7).', rest:'When does your practical realism quietly become a faith-killer &mdash; where being realistic is really just leaving God out of the equation?'},
 {lead:'Jesus already knew what he would do, but tested Philip first (John 6:6).', rest:'How do you respond when God lets you face a problem with no visible solution? What does your first reaction reveal about where you are looking?'},
 {lead:'Philip&rsquo;s move with Nathanael was &ldquo;come and see&rdquo; &mdash; not an argument, just an invitation.', rest:'Who in your life needs a low-pressure &ldquo;come and see&rdquo; from you right now?'},
 {lead:'&ldquo;Show us the Father&rdquo; &mdash; Philip wanted more proof after years with Jesus.', rest:'What &ldquo;more&rdquo; are you quietly waiting for &mdash; more clarity, more security, more evidence &mdash; before you will fully trust him?', land:true},
 {lead:'Where is Jesus inviting you to act <em>before</em> the numbers add up?', rest:'What is the step where you can see the cost clearly but not the outcome?', land:true}
],
couples:'Is there a decision where one of you is the Philip, counting the cost, and the other is ready to step out? How could you honor both &mdash; taking the practical realism seriously <em>and</em> refusing to let it have the final word over what God might do?',
dry:'<em>&ldquo;When was the last time you did the math on something and it talked you out of a step of faith?&rdquo;</em> It gets the practical people talking honestly without feeling judged for being practical.',
takeaway:'&ldquo;When your practical heart says <b>just show me</b>, Jesus&rsquo;s answer is <b>himself.</b> You don&rsquo;t have to make the numbers add up before you trust him &mdash; Christ is already the evidence you were looking for.&rdquo;',
prayer:'Close in prayer. Thank Jesus that he does not shame the analytical, cautious, show-me hearts in the room &mdash; he meets them with himself. Ask him to help the practical people trust the One standing in front of them, to act before the math is finished, and to be people who, like Philip, simply bring others to come and see.',
readaloud:'<b>Read at 0:08, back to back:</b> John 1:43&ndash;46 (the call and &ldquo;come and see&rdquo;), then John 14:8&ndash;9 (&ldquo;Lord, show us the Father&rdquo;). The first scene and the last one together let the group hear the whole arc before you teach it &mdash; the man who said &ldquo;come and see&rdquo; to Nathanael at the beginning is, years later, still asking Jesus to show him.',
anchors:[
 {ref:'John 1:43&ndash;46', note:'Jesus finds Philip; &ldquo;come and see&rdquo;'},
 {ref:'John 6:5&ndash;7', note:'Jesus tests him about feeding the crowd'},
 {ref:'John 12:20&ndash;22', note:'the seeking Greeks, with Andrew'},
 {ref:'John 14:8&ndash;9', note:'&ldquo;show us the Father&rdquo;; whoever has seen me'},
 {ref:'Matt 10:3 &middot; Mark 3:18 &middot; Luke 6:14 &middot; Acts 1:13', note:'always fifth in the lists'}
],
glance:[
 {dt:'Name', dd:'Philip, Greek <i>Philippos</i>, &ldquo;lover of horses&rdquo;'},
 {dt:'Home', dd:'Bethsaida &mdash; &ldquo;the city of Andrew and Peter&rdquo; (John 1:44). The same fishing town produced three of the Twelve.'},
 {dt:'His call', dd:'Sought out directly. <span class="note">Jesus found Philip and said &ldquo;Follow me&rdquo; (John 1:43)</span>'},
 {dt:'Not to be confused with', dd:'Philip the Evangelist, the deacon of Acts 6 and 8. A different man.'}
]
});
S.push({
n:6, slug:'bartholomew', name:'Bartholomew / Nathanael', group:2,
sub:'Of Cana in Galilee &middot; the man with no guile',
hook:'The man with no guile &mdash; who started with a sneer and ended on his knees, because <em>Jesus already knew him before he ever knew Jesus.</em>',
essence:'The man with no guile. Skeptic to worshiper in sixty seconds.',
warn:'<b>One identification note, so you can say it cleanly.</b> The man called <b>Bartholomew</b> in the three Synoptic lists and in Acts is, by long tradition, the same man <b>John</b> calls <b>Nathanael</b>. Scripture never says so directly. The case: Bartholomew is a patronymic &mdash; <i>Bar-Tolmai</i>, son of Tolmai &mdash; not really a first name, so a personal name like Nathanael fits naturally alongside it; and in the Gospel lists Bartholomew is paired with Philip, who is exactly the man who brings Nathanael to Jesus in John 1. The common and likely view, <b>but a traditional identification, not a stated fact of Scripture.</b> Say it that way to the group.',
spine:[
 {ref:'John 1:46 &middot; the wall', head:'&ldquo;Can anything good come out of Nazareth?&rdquo;', body:'His first recorded words about Jesus are a put-down. He knew his Bible well enough to know the Messiah was not supposed to come from a backwater like that.'},
 {ref:'John 1:47&ndash;48 &middot; the welcome', head:'&ldquo;I saw you under the fig tree&rdquo;', body:'Jesus speaks first, before Nathanael says a word to him: an Israelite indeed, in whom there is no deceit. Then he describes a private moment Nathanael thought nobody witnessed.'},
 {ref:'John 1:49 &middot; the collapse', head:'&ldquo;You are the Son of God&rdquo;', body:'The prejudice did not get answered. It dissolved. Being personally, intimately seen melted the cynicism off in seconds.'}
],
links:['Then the welcome','Then worship'],
prep:[
 'Nathanael is the right disciple for the middle of the series because he is the <b>honest skeptic in the room</b> &mdash; and almost certainly <em>someone</em> in the room is exactly that. He does not pretend interest he does not feel. His first recorded words about Jesus are a put-down. And yet within minutes he is worshiping.',
 'Tonight&rsquo;s job is to show the group <b>what turned him</b> &mdash; not a better argument, not more effort, but the discovery that Jesus already saw him, fully, before he came. That is the whole point: <em>we are known before we are willing.</em>',
 '<b>The trap to avoid:</b> &ldquo;Be honest like Nathanael &mdash; just be more authentic, drop the act, try harder to be real.&rdquo; That flips the story backward. His transparency is lovely, but it is <b>not what saved him.</b> What changed him was being seen and welcomed by Jesus <em>before</em> he had cleaned himself up or come around. Keep the order straight: Jesus knows and welcomes us first; honesty is the response to grace, not the price of it.'
],
scenes:[
 {tag:'John 1:46', head:'Says what he actually thinks', body:'<q>Can anything good come out of Nazareth?</q> No filter, no flattery. He is not performing belief he does not have.'},
 {tag:'John 1:46', head:'Honest, not closed', body:'The same man who sneers also <em>goes</em> when Philip says come and see. His skepticism is the kind willing to be tested &mdash; a doubter still walking toward the evidence, not away from it.'},
 {tag:'John 1:47', head:'A man Jesus calls guileless', body:'<q>An Israelite indeed, in whom there is no deceit!</q> No guile. What you see is what you get &mdash; no angle, no spin, no inner con.'},
 {tag:'John 1:48', head:'Thoughtful, maybe prayerful', body:'&ldquo;Under the fig tree&rdquo; was a traditional image of a quiet place to study and pray. We cannot prove what he was doing there, but the picture is of a contemplative man alone with God before Jesus ever called his name.'}
],
leadernote:'Don&rsquo;t soften Nathanael&rsquo;s skepticism into a flaw he had to overcome. Jesus <em>praised</em> the very transparency that produced the blunt question. The honest doubter and the &ldquo;no deceit&rdquo; man are the same man. <b>Jesus wasn&rsquo;t put off by the eyebrow; he loved that there was nothing fake underneath it.</b>',
versus:{
 aK:'What did not change him', aQuote:'&ldquo;Can anything good come out of Nazareth?&rdquo;',
 aBody:'Philip never out-argued the Nazareth objection. Nathanael did not reason his way past his own bias. Nothing in his theology had a slot for a Messiah from there.',
 bK:'What did', bQuote:'&ldquo;Before Philip called you, when you were under the fig tree, I saw you.&rdquo;',
 bBody:'He was simply <em>found out</em>, in the best possible way. Right perspective came not from getting his theology corrected but from <em>being personally known by Christ.</em>'
},
down:'The being-known came first. The believing came second.',
after:'And then Jesus stretches him further, promising he will <b>see greater things than these &mdash; heaven opened, and the angels of God ascending and descending on the Son of Man</b> (John 1:50&ndash;51). An unmistakable echo of <b>Jacob&rsquo;s ladder</b> (Gen 28:12), with Jesus himself as the place where heaven and earth meet. Nathanael&rsquo;s first glimpse was only the doorway.',
contribution:[
 {dt:'The picture of guileless faith', dd:'Jesus&rsquo;s commendation makes him the New Testament&rsquo;s portrait of the transparent believer: no front, no spin, nothing managed. In a world of image and performance, the disciple who simply <em>is what he is</em> before God.'},
 {dt:'One of the Twelve, start to finish', dd:'Named in every apostle list, among the seven at the Sea of Tiberias (John 21:2), and still in the upper room heading into Pentecost (Acts 1:13). He was there for the whole thing.'},
 {dt:'A witness to the risen Christ', dd:'Specifically named when the risen Jesus appears at the Sea of Tiberias &mdash; an eyewitness of the resurrection, not just the ministry.'},
 {dt:'Faithfulness, not fame', dd:'He wrote no epistle. We have one conversation and a fishing trip. You do not need a large platform or a recorded sermon to matter to the kingdom.'}
],
tradition:'Early tradition has Bartholomew carrying the gospel a long way from Galilee &mdash; to places such as <b>India and Armenia</b> &mdash; and dying a martyr&rsquo;s death, often described as being <b>flayed</b> in Armenia. <b>Tradition, not Scripture</b>, and the accounts vary in their details. Treat it as the church&rsquo;s memory, not biblical fact.',
guardrail:{
 speech:'This is <em>not</em> a &ldquo;be honest like Nathanael, just be more authentic&rdquo; lesson. Watch the order: Nathanael did not get cleaned up, drop his guard, and <em>then</em> earn Jesus&rsquo;s notice. Jesus saw him under the fig tree &mdash; skepticism and all &mdash; <em>before Philip ever called him.</em> Jesus knew him before he knew Jesus, and welcomed him before he came. That is the gospel for every one of us. You do not make yourself honest enough, sincere enough, or doubt-free enough to qualify for Jesus. He already knows you &mdash; every private fig-tree moment, every cynical thought &mdash; and he comes for you anyway. Our transparency is not the <em>price</em> of being welcomed. It is what becomes possible once we realize we already are.',
 foot:'<b>Indicative before imperative.</b> The worship (&ldquo;you are the Son of God,&rdquo; 1:49) and the call to follow flow <b>out of</b> being already seen and welcomed (1:47&ndash;48). We don&rsquo;t get known by becoming honest; we <em>become</em> honest because we are already fully known and fully loved. Trace the order out loud &mdash; the order is the gospel: <b>before</b> Philip called, <b>before</b> Nathanael decided to come and see, <b>before</b> he believed anything.'
},
questions:[
 {lead:'Nathanael&rsquo;s first reaction to Jesus was skepticism.', rest:'Is honest skepticism a <em>barrier</em> to faith, or can it be a <em>doorway</em>? Where are you right now &mdash; and has doubt ever actually moved you closer to God rather than further away?'},
 {lead:'Jesus praised Nathanael for having &ldquo;no deceit.&rdquo;', rest:'How honest are you really &mdash; with God, with the people closest to you, and with yourself? Where is the gap?'},
 {lead:'What moved him was not a better argument &mdash; it was being fully known.', rest:'When have you felt truly <em>known</em> by God, not just believed-in by you, but seen by him? What did that do to you?'},
 {lead:'He went from &ldquo;can anything good come?&rdquo; to &ldquo;you are the Son of God&rdquo; in minutes.', rest:'What do you think would actually move <em>you</em> from doubt to worship &mdash; and is it more information you are waiting on, or something else?', land:true},
 {lead:'Where are you hiding behind a little guile &mdash; image management, a curated version of yourself?', rest:'Jesus is gently inviting you to drop it, because he already sees the real thing and welcomes you anyway.', land:true}
],
couples:'Marriage is one of the few places someone sees you with the guard fully down &mdash; under your own fig tree. Where do you still manage your image <em>with your spouse</em>? What would change if you let yourself be as known by them as Jesus already knows you?',
dry:'<em>&ldquo;What is a can-anything-good-come-out-of-Nazareth moment you have had &mdash; a time you wrote something or someone off, fast, and were dead wrong?&rdquo;</em> It gets honest laughter and opens the door to the skeptic-to-worship turn.',
takeaway:'&ldquo;Jesus knew you before you ever knew him &mdash; every hidden, fig-tree moment of your life &mdash; and he came for you anyway. <b>You don&rsquo;t get welcomed by becoming honest enough. You become honest because you are already fully known and fully loved.</b>&rdquo;',
prayer:'Close in prayer. Thank Jesus that he sees us completely &mdash; the skepticism, the spin, the private places we think no one watches &mdash; and welcomes us before we ever clean ourselves up or come around. Ask him to make the group people who, like Nathanael, stop managing their image and live transparently before the One who already knows it all.',
readaloud:'<b>Read at 0:08:</b> John 1:45&ndash;51, the whole meeting start to finish. It is short and it carries the entire night &mdash; the prejudice, the welcome, the &ldquo;I saw you,&rdquo; and the confession all sit in seven verses. If time allows, add John 21:2 so the group hears he is still there at the very end, fishing with the others after the resurrection.',
anchors:[
