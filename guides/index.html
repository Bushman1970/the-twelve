S.push({
n:7, slug:'thomas', name:'Thomas', group:2,
sub:'Called the Twin &middot; Didymus',
hook:'The honest doubter who gave the highest confession &mdash; proof that Jesus condescends to honest doubt and <em>offers his own wounds.</em>',
essence:'The honest doubter who gave the highest confession.',
spine:[
 {ref:'John 11:16 &middot; the courage', head:'&ldquo;Let us also go, that we may die with him&rdquo;', body:'Jesus turns back toward the region where they had just tried to stone him, and Thomas rallies the others. The bravest line any disciple speaks before the cross.'},
 {ref:'John 20:25 &middot; the terms', head:'&ldquo;Unless I see&hellip; I will never believe&rdquo;', body:'He was not in the room. He refuses to borrow anyone else&rsquo;s certainty, and names exactly what he needs: the nail marks and the wounded side.'},
 {ref:'John 20:27&ndash;28 &middot; the answer', head:'Jesus came back and offered his scars', body:'Eight days later, and the text suggests he came back largely for Thomas. Not a rebuke &mdash; an invitation. Then the highest confession in the Gospels.'}
],
links:['Then the doubt','Grace first'],
prep:[
 'Thomas is the right disciple for a mixed-maturity room because almost everyone in the room is carrying a question they are afraid to say out loud &mdash; and Thomas says his out loud. He gets a bad nickname from history, but the man Scripture actually shows us is <b>honest, courageous, loyal, and unwilling to fake a faith he does not feel.</b>',
 'And here is the turn: when he finally meets the risen Christ, the doubter gives the single clearest confession of Jesus&rsquo;s deity in the Gospels &mdash; <em>My Lord and my God!</em> Tonight&rsquo;s job is to let the doubters in the room exhale, then watch what Jesus <em>does</em> with honest doubt. He comes back, and he offers his wounds.',
 '<b>The trap to avoid:</b> &ldquo;Stop doubting and have more faith.&rdquo; That is the opposite of what Jesus does. Jesus never shames Thomas&rsquo;s honesty &mdash; he condescends to it, returns for him, and invites him to touch the scars. The lesson is not &ldquo;manufacture certainty.&rdquo; It is <b>bring your real doubt to the real Jesus, because he meets it.</b>'
],
scenes:[
 {tag:'John 14:5', head:'Honest to a fault', body:'At the Last Supper eleven men nod along about &ldquo;the way.&rdquo; Thomas raises his hand: <q>Lord, we do not know where you are going. How can we know the way?</q> He will not pretend to understand what he does not.'},
 {tag:'John 11:16', head:'Courageous and loyal', body:'<q>Let us also go, that we may die with him.</q> Not optimism &mdash; grim, all-in loyalty. Whatever else Thomas is, he is not a coward.'},
 {tag:'John 20:25', head:'A realist, prone to melancholy', body:'He braces for the worst. When Jesus heads toward danger, Thomas assumes death. When the others report a resurrection, he assumes they are wrong. His default setting is sober, not sunny.'},
 {tag:'John 20:25', head:'Won&rsquo;t profess what he doesn&rsquo;t have', body:'This is the heart of him. He refuses to mouth a confession his heart has not reached &mdash; and that refusal is a kind of integrity.'}
],
leadernote:'Resist letting the room reduce Thomas to &ldquo;the weak one.&rdquo; Plenty of people in church history have been less honest and more lost. Thomas&rsquo;s problem was never dishonesty &mdash; it was that he was looking for the risen Christ in the right place but <em>on his own terms</em>, and Jesus graciously met him there.',
versus:{
 aK:'What he would not accept', aQuote:'&ldquo;We have seen the Lord.&rdquo;',
 aBody:'The disciples come to him glowing. For Thomas that is not enough. He wasn&rsquo;t in the room; he didn&rsquo;t see. <em>He refuses to live on someone else&rsquo;s experience of God.</em>',
 bK:'What he demanded to see', bQuote:'&ldquo;The mark of the nails&hellip; and place my hand into his side.&rdquo;',
 bBody:'Notice <em>what</em> he wants to see: not just any Jesus, but the <b>crucified</b> Jesus, scars and all. Even Thomas&rsquo;s doubt is pointed at the right thing.'
},
down:'His honest doubt was a doorway, not a dead end.',
after:'The moment he meets the risen Christ he does not analyze or hesitate. He <b>worships</b>: &ldquo;My Lord and my God!&rdquo; <em>The man who demanded the most evidence offers the most extravagant confession.</em> So the gap in Thomas is not a cold, modern skepticism. It is the very human refusal to live on secondhand faith. That can look like stubbornness &mdash; and it is fair to ask the room where the line is &mdash; but in Thomas&rsquo;s case it drove him <b>toward</b> Christ, not away.',
contribution:[
 {dt:'The highest confession in the Gospels', dd:'&ldquo;My Lord and my God!&rdquo; (John 20:28) is the clearest, most complete statement of Jesus&rsquo;s deity any human being makes in the four Gospels. The doubter gets there first and most fully &mdash; and Jesus <em>receives</em> the worship rather than correcting it.'},
 {dt:'A blessing aimed straight at us', dd:'&ldquo;Blessed are those who have not seen and yet have believed&rdquo; (John 20:29) &mdash; the last beatitude in John, and it is for every believer since. Thomas&rsquo;s story is the bridge between the eyewitnesses and us.'},
 {dt:'The question that drew out a treasure', dd:'His &ldquo;how can we know the way?&rdquo; is what prompts &ldquo;I am the way, and the truth, and the life&rdquo; (John 14:6). The church has Thomas&rsquo;s honest question to thank for one of Jesus&rsquo;s clearest self-revelations.'},
 {dt:'Three scenes, all in John', dd:'11:16 loyalty &middot; 14:5 the question &middot; 20:24&ndash;29 doubt into confession. He appears in all four apostle lists but only speaks in John.'}
],
tradition:'Thomas carried the gospel farther east than any other apostle &mdash; to <b>India</b>. The Mar Thoma / St. Thomas Christians of India trace their origin to him, and tradition says he was martyred near <b>Chennai (Mylapore)</b>. <b>Tradition, not Scripture.</b> Also unknown: <em>whose</em> twin he was. Scripture gives him the name and never the sibling &mdash; and no hometown, trade, or family either.',
guardrail:{
 speech:'Hear me carefully: this is <em>not</em> a &ldquo;stop doubting and have more faith&rdquo; lesson. Look at what Jesus actually does. He does not shame Thomas. He does not say &ldquo;you should have believed the others.&rdquo; He <em>comes back for him</em>, and he <em>offers his own scars.</em> Jesus condescends to honest doubt. He would rather have a Thomas who wrestles his way to worship than a follower who only pretends to believe. So if you are carrying a real question tonight, the answer is not &ldquo;try to feel more certain.&rdquo; The answer is: bring it to the real Jesus, because that is exactly the kind of person he shows up for.',
 foot:'<b>Grace before command.</b> Notice the order. Jesus offers his wounds <em>first</em> &mdash; the grace, the evidence, the condescension &mdash; and only then says &ldquo;believe&rdquo; (John 20:27). Thomas doesn&rsquo;t claw his way to faith; the risen Christ comes and gives it to him. We don&rsquo;t manufacture belief to earn an encounter with Jesus; we believe <b>because he came looking.</b> He could have left Thomas to figure it out, or written him off as the weak link. He came back instead.'
},
questions:[
 {lead:'Thomas refused to pretend to believe.', rest:'Is that honesty or stubbornness? Where in your own life do you fake a certainty you do not actually feel?'},
 {lead:'Jesus didn&rsquo;t scold Thomas &mdash; he offered his wounds (John 20:27).', rest:'How does that change the way you would bring your doubts and questions to God?'},
 {lead:'The doubter gave the highest confession.', rest:'Have your hardest questions ever ended up leading you to a <em>deeper</em> faith, not a weaker one?'},
 {lead:'Jesus blessed those who believe without seeing (John 20:29).', rest:'What is he asking you to trust him with right now without the proof you would prefer to have first?', land:true},
 {lead:'Thomas was also the one ready to die with Jesus (John 11:16).', rest:'How do courage and doubt live in the same person &mdash; and where do you see both of them in yourself?', land:true}
],
couples:'Is there a doubt or a fear you have kept from your spouse because you thought you were supposed to look more certain than you feel? What would it look like to be Thomas-honest with each other &mdash; and to offer each other Jesus&rsquo;s kind of patience instead of a lecture?',
dry:'<em>&ldquo;When is the last time you had a real doubt about God &mdash; and did you feel like you were allowed to say it out loud here?&rdquo;</em> It gives the room permission to be honest, which is the whole point tonight.',
takeaway:'&ldquo;Jesus meets honest doubt with <b>open wounds, not a lecture.</b> Bring him your real questions &mdash; he comes back for the ones who won&rsquo;t fake it.&rdquo;',
prayer:'Close in prayer. Thank Jesus that he condescends to our doubt &mdash; that he came back for Thomas, offered his scars, and receives the worship of people who arrive at faith the hard way. Ask him to make the group honest before God, unafraid of their questions, and able to say with Thomas, &ldquo;My Lord and my God!&rdquo;',
readaloud:'<b>Read at 0:08:</b> John 11:16 first &mdash; just the one verse, the courage &mdash; then John 20:24&ndash;29, the doubt and the confession. Reading the courage <em>before</em> the doubt reframes the whole night: the same man willing to die with Jesus is the man who later says &ldquo;unless I see, I will never believe.&rdquo; Doubt and courage in one person.',
anchors:[
 {ref:'John 11:16', note:'ready to die with him'},
 {ref:'John 14:5', note:'the question that gets &ldquo;I am the way&rdquo;'},
 {ref:'John 20:24&ndash;29', note:'absent, then the terms, then &ldquo;My Lord and my God!&rdquo;'},
 {ref:'John 21:2', note:'still with them after the resurrection'},
 {ref:'Matt 10:3 &middot; Mark 3:18 &middot; Luke 6:15 &middot; Acts 1:13', note:'in every apostle list'}
],
glance:[
 {dt:'Names', dd:'Thomas, Aramaic for twin &middot; Didymus, the Greek for twin (John 11:16). <span class="note">&ldquo;Doubting Thomas&rdquo; is a later nickname, not Scripture&rsquo;s name for him</span>'},
 {dt:'Background', dd:'Hometown, trade and family all unrecorded. <span class="note">Whose twin he was is unknown</span>'},
 {dt:'His confession', dd:'&ldquo;My Lord and my God!&rdquo; &mdash; the clearest statement of Jesus&rsquo;s deity in the Gospels.'},
 {dt:'Pairs with', dd:'Bartholomew / Nathanael, the previous session. The open-hearted man with no guile beside the honest skeptic.'}
]
});
S.push({
n:8, slug:'matthew', name:'Matthew', group:2,
sub:'Also called Levi, son of Alphaeus &middot; the tax collector',
hook:'The tax collector grace reached <em>at his booth</em> &mdash; called while he was still disqualified.',
essence:'The tax collector grace reached at his booth.',
spine:[
 {ref:'Matt 9:9 &middot; the booth', head:'Two words at his post', body:'Jesus walks up to a working tax collector &mdash; mid-sin, mid-career, at the booth &mdash; and says &ldquo;Follow me.&rdquo; No resistance, no negotiation. He rose and followed him.'},
 {ref:'Luke 5:29 &middot; the feast', head:'His first move was a party', body:'&ldquo;Levi made him a great feast in his house,&rdquo; with a large company of tax collectors and others at the table. His instinct was to gather every outcast he knew and put them in a room with Jesus.'},
 {ref:'Matt 9:12&ndash;13 &middot; the answer', head:'&ldquo;I came not to call the righteous&rdquo;', body:'The religious crowd grumbles about the company. Jesus answers with a diagnosis and a mission statement: the sick need a physician, and he came for sinners.'}
],
links:['Then the table','Then the mission'],
prep:[
 'Matthew is the clearest single picture of grace reaching the <em>disqualified</em>. Everyone else Jesus called had something &mdash; fishermen had an honest trade, a zealot had a cause. Matthew had a booth, a profit, and a town that hated him for both. He was a Jew working Rome&rsquo;s tax system for Herod Antipas, regarded by his own people as a traitor and a cheat.',
 '<b>And Jesus walked straight up to the very person his town had written off and said two words: Follow me.</b> Tonight&rsquo;s job is to let the group feel how scandalous that call was, then turn their eyes from Matthew&rsquo;s past to the Christ who came specifically <em>for</em> people like him.',
 '<b>The trap to avoid:</b> &ldquo;Be willing to drop everything like Matthew.&rdquo; That turns the night into a willpower test &mdash; try harder, respond faster. But Matthew&rsquo;s instant obedience is the <em>result</em> of grace finding him, not the price of it. Keep returning to Jesus&rsquo;s own line: <b>I came not to call the righteous, but sinners</b> (Matt 9:13).'
],
scenes:[
 {tag:'Matt 9:9', head:'Responsive', body:'No recorded hesitation. <q>He rose and followed him.</q> A lucrative, secure post abandoned on the spot. When grace called, he moved.'},
 {tag:'Luke 5:29', head:'Generous and hospitable', body:'His first act as a follower was to spend his house and his table on a feast for outsiders. Whatever he had, he opened it up.'},
 {tag:'Matt 10:3', head:'Self-effacing &mdash; and this is the tell', body:'In his own Gospel&rsquo;s list of the Twelve, Matthew is the <em>only</em> one who tags himself with his old job: <q>Matthew the tax collector.</q> Mark and Luke drop the label. He kept the scarlet word on himself.'},
 {tag:'Mark 2:14 &middot; Luke 5:27', head:'Two names, one man', body:'Mark and Luke call him <q>Levi the son of Alphaeus.</q> His own Gospel calls him Matthew. Same man, same booth at Capernaum.'}
],
leadernote:'Don&rsquo;t sand Matthew&rsquo;s past off to make him &ldquo;respectable.&rdquo; His whole witness depends on the gap between who he was and who Jesus called him to be. The tax-collector label isn&rsquo;t a stain to apologize for &mdash; <em>it is the headline of his testimony.</em> Let the group sit with how unlikely this call was; that is the point, not a problem to smooth over.',
versus:{
 aK:'The Pharisees&rsquo; two categories', aQuote:'&ldquo;Why does your teacher eat with tax collectors and sinners?&rdquo;',
 aBody:'They were not wrong about the company. They saw clean and unclean and built their identity on being in the right one. <em>They thought they were well &mdash; which is precisely why they missed the physician standing in front of them.</em>',
 bK:'What Matthew knew about himself', bQuote:'&ldquo;Those who are well have no need of a physician, but those who are sick.&rdquo;',
 bBody:'Matthew really <em>was</em> a sinner, and he had no illusions about being one of the righteous. His town had stripped that from him years before. <em>He knew he was sick.</em>'
},
down:'He knew which group he was in. That knowledge is what made room for Jesus.',
after:'This is grace understood <b>from the bottom up.</b> Matthew never had to be talked out of self-righteousness, because he never had any to begin with. So when Jesus said &ldquo;I came not to call the righteous, but sinners,&rdquo; Matthew heard it as the best news a disqualified man could possibly receive: <em>that is me &mdash; and he came for me.</em>',
contribution:[
 {dt:'The first Gospel', dd:'The most <b>Jewish</b> of the four, built around Old Testament fulfillment. The book that argues most carefully that Jesus is Israel&rsquo;s promised Messiah was written by the very kind of man devout Israel despised.'},
 {dt:'A bridge to the table', dd:'His instinct from day one &mdash; the feast for tax collectors and sinners &mdash; became a picture of his whole life: a man who used his place at Jesus&rsquo;s table to bring the outsiders in.'},
 {dt:'A record-keeper&rsquo;s gift redeemed', dd:'A tax collector lived by careful records, lists and numbers. Fitting that his Gospel is the most carefully organized &mdash; five great teaching blocks, genealogies, fulfillment citations. The skill his old job gave him got redeemed into service of the King.'},
 {dt:'One of the Twelve', dd:'Named in the apostle lists (Matt 10:3), and there through Pentecost.'}
],
tradition:'The <b>authorship of the Gospel of Matthew</b> is early and consistent <b>church attribution, not stated in Scripture</b> &mdash; the text itself is anonymous. Say that plainly and then teach it as the church has received it. His later ministry in <b>Ethiopia or Persia</b> and his martyrdom are also <b>tradition, not Scripture</b>, and the accounts vary. Scripture records neither.',
guardrail:{
 speech:'This is <em>not</em> a &ldquo;be ready to drop everything like Matthew&rdquo; lesson. Matthew did not earn this call by being eager &mdash; he was <em>sitting at the booth</em>, doing the very thing that disqualified him, when grace walked up. Look at the order: Jesus calls him <em>first</em>, while he is still a tax collector. The response &mdash; getting up, throwing the feast &mdash; comes <em>after</em> the call, <em>because</em> of the call. That is the whole gospel right there. Jesus says, <em>I came not to call the righteous, but sinners.</em> Grace does not wait at the finish line for you to qualify. It seeks the disqualified right at their post. The r&eacute;sum&eacute; of failure is the hiring criteria. He came for exactly the kind of person who is sure they are too far gone &mdash; and he comes for you the same way.',
 foot:'<b>Indicative before imperative.</b> The command (&ldquo;Follow me&rdquo;) is <em>itself</em> an act of grace toward a sinner, and everything Matthew did afterward flowed <b>out of</b> being sought, not in order to be worthy of it. We don&rsquo;t get called because we qualify; we follow <b>because we were called while we couldn&rsquo;t.</b> And remember why his town despised him: the system ran on overcharging, so he was seen as both a traitor to his people and a cheat against his neighbors. That is the man Jesus picked.'
},
questions:[
 {lead:'Matthew was the last person his town expected Jesus to call.', rest:'Who do you secretly think is too far gone for grace &mdash; a person, or a category of person?'},
 {lead:'He left a lucrative, secure job instantly (Matt 9:9).', rest:'What would Jesus&rsquo;s &ldquo;follow me&rdquo; cost you to obey <em>today</em> &mdash; and is the cost what is holding you back?'},
 {lead:'Matthew&rsquo;s first instinct was a party for his old crowd (Luke 5:29).', rest:'Does your faith open doors to your pre-Jesus friends, or has it quietly closed them?'},
 {lead:'The religious crowd grumbled that Jesus ate with sinners (Matt 9:11).', rest:'Are you ever more comfortable <em>judging</em> the Matthews than <em>sitting with</em> them? Where?', land:true},
 {lead:'A tax collector became a Gospel writer.', rest:'What part of your past do you assume disqualifies you &mdash; that God might actually be planning to <em>use</em>?', land:true}
],
couples:'Is there a part of your spouse&rsquo;s past, or your own, that you have quietly filed under disqualified &mdash; a category you have stopped expecting God to redeem? What would it look like to treat that the way Jesus treated Matthew&rsquo;s booth: as the exact place grace shows up?',
dry:'<em>&ldquo;Who is the Matthew in your life &mdash; the person you would be honestly surprised to see God reach?&rdquo;</em> It surfaces the same blind spot the Pharisees had, without anyone having to admit it about themselves first.',
takeaway:'&ldquo;Grace doesn&rsquo;t wait for you to qualify &mdash; <b>it seeks the disqualified right at their post.</b> The very thing you think rules you out is often what Jesus came to redeem.&rdquo;',
prayer:'Close in prayer. Thank Jesus that he came not to call the righteous but sinners &mdash; that he walks straight up to the people the world has written off and says &ldquo;Follow me&rdquo; before they have cleaned anything up. Ask him to free the group from the lie that any past puts a person out of his reach, and to make them, like Matthew, people who pull up a chair for the outsiders.',
readaloud:'<b>Read at 0:08:</b> Matthew 9:9&ndash;13. This single passage holds the whole story &mdash; the call at the booth, the dinner with tax collectors and sinners, the religious grumbling, and Jesus&rsquo;s answer. If time allows, also read Luke 5:27&ndash;32 so the group hears that Matthew&rsquo;s first move was to throw <em>a great feast in his house</em> &mdash; the detail that tells you everything about the man.',
anchors:[

 {ref:'Mark 2:13&ndash;17', note:'parallel; names him Levi the son of Alphaeus'},
 {ref:'Luke 5:27&ndash;32', note:'parallel; the great feast in his house'},
 {ref:'Matt 10:3', note:'the label he kept on himself'}
],
glance:[
 {dt:'Names', dd:'Matthew, in his own Gospel &middot; Levi, son of Alphaeus (Mark 2:14; Luke 5:27). Same man.'},
 {dt:'Post &amp; trade', dd:'Tax booth at Capernaum, on the trade road by the Sea of Galilee. Collecting for Rome under Herod Antipas.'},
 {dt:'First act as a follower', dd:'A great feast for tax collectors and sinners (Luke 5:29).'},

S.push({
n:9, slug:'james-alphaeus', name:'James, son of Alphaeus', group:3,
sub:'The disciple we know least &middot; no recorded words, no recorded deeds',
hook:'Faithful in obscurity. Scripture records his name and nothing else &mdash; and <em>that silence turns out to be a sermon.</em>',
essence:'Faithful in obscurity. The disciple we know least.',
warn:'<b>The most common mix-up, and you should head it off out loud.</b> This is <b>not</b> James the brother of Jesus &mdash; the leader of the Jerusalem church and author of the epistle of James (Acts 15; Gal 1:19; James 1:1). That James was <em>not</em> one of the Twelve. When someone asks &ldquo;didn&rsquo;t James write a whole book of the Bible?&rdquo; the answer is: that is the other James. <b>Don&rsquo;t let the room hand our obscure apostle a r&eacute;sum&eacute; that isn&rsquo;t his. The silence is the point.</b>',
spine:[
 {ref:'Luke 6:12&ndash;13 &middot; chosen', head:'Prayed over all night, called by name', body:'Jesus went to the mountain and continued all night in prayer, and when day came he chose twelve. James son of Alphaeus was not an accident or a filler. He was prayed over, the same as Peter.'},
 {ref:'Acts 1:13&ndash;14 &middot; still there', head:'Present and praying', body:'The last place Scripture puts him: the upper room, with one accord, devoting themselves to prayer. Of the original Twelve, one fell away. James did not.'},
 {ref:'Rev 21:14 &middot; remembered', head:'His name is in the eternal city', body:'The wall of the new Jerusalem has twelve foundations, and on them the names of the twelve apostles of the Lamb. Barely written in the Gospels. Carved into the city that lasts.'}
],
links:['Then he stayed','Then forever'],
prep:[
 'This is the hardest session in the series to teach &mdash; and that is exactly why it might be the most important one for the group. Eight nights running there have been stories: a man who walked on water, a doubter offered the wounds, a tax collector who left his booth. <b>Tonight there is no story.</b> Scripture gives us his name on four lists and nothing more. No quotation, no scene, no miracle, no death.',
 '<b>Resist the temptation to fill the silence.</b> The whole power of this night is letting the group sit in how <em>little</em> we are told &mdash; and then realizing that Jesus chose this man, named him among the Twelve, and counted his hidden faithfulness as no less real than Peter&rsquo;s loud one. The theme is not biography. There is none. The theme is the dignity and sufficiency of <b>being known to God</b> when no one else is watching.',
 '<b>The trap to avoid:</b> turning this into &ldquo;be faithful like James by trying harder in the background.&rdquo; That misses it twice. First, we know nothing about James&rsquo;s faithfulness to imitate &mdash; Scripture does not show it; we only know Jesus <em>chose</em> him. Second, the grace runs the other direction: the point is not that James earned a place by quiet effort, but that <b>Jesus chooses, treasures, and sends people history never notices.</b>'
],
scenes:[
 {tag:'Mark 15:40 &mdash; uncertain', head:'&ldquo;James the younger&rdquo;', body:'The Greek <i>mikros</i> means small or little &mdash; possibly younger, possibly shorter, possibly lesser in prominence. If this is our James, even his nickname marks him as the overlooked one. <em>An inference from the name, not something Scripture states.</em>'},
 {tag:'Matt 10:3', head:'A common name, a quiet line', body:'James is ordinary &mdash; Hebrew <i>Jacob</i>, one of the most common Jewish names of the era. His father&rsquo;s name only serves to keep him from being confused with someone more famous. Everything about how Scripture handles him says: <em>this one is not the headline.</em>'},
 {tag:'Acts 1:13&ndash;14', head:'Present and praying', body:'The one place we see him doing anything, he is doing the most ordinary, least visible thing a believer does &mdash; gathered with the others, praying, waiting on the Spirit. No spotlight. Just there. <em>Still there.</em>'},
 {tag:'Mark 2:14 &mdash; uncertain', head:'Brother of Matthew?', body:'Matthew / Levi is also called son of Alphaeus, so some speculate the two were brothers. <em>The Gospels never say so, and Alphaeus may simply have been a common name. Do not teach it as fact.</em>'}
],
leadernote:'Don&rsquo;t apologize for the thinness here, and don&rsquo;t pad it with legends. Name it out loud: &ldquo;We&rsquo;re not going to make up a personality for him. The Bible didn&rsquo;t give us one. <em>And tonight that absence is going to do more for us than a highlight reel would.</em>&rdquo;',
versus:{
 aK:'How we measure significance', aQuote:'What got recorded.',
 aBody:'Visibility, story, platform. Eight sessions of high-resolution portraits have trained the room to expect a highlight reel &mdash; and this week there isn&rsquo;t one. His trade, hometown, call, words, deeds and death are all simply blank.',
 bK:'How Jesus measures it', bQuote:'&ldquo;The Lord knows those who are his.&rdquo;',
 bBody:'God <em>chose what is low and despised in the world, so that no human being might boast</em> (1 Cor 1:28&ndash;29) &mdash; the same God who calls into existence the things that do not exist (Rom 4:17). <em>The pattern all through Scripture is to treasure the unseen one.</em>'
},
down:'Being unrecorded is not the same as being unimportant.',
after:'Put the question to the group as theology, not biography: <b>what does it mean to be chosen by Jesus and never noticed by anyone else?</b> James had no platform and is no less an apostle for it. Ephesians says the church is built on the foundation of the apostles, Christ Jesus himself the cornerstone (Eph 2:20). <b>He is one of those foundation stones whether or not we can read his story.</b>',
contribution:[
 {dt:'He was one of the Twelve', dd:'Not small. The Twelve are the appointed, eyewitness foundation of the church &mdash; with Jesus, sent by Jesus, entrusted with the gospel.'},
 {dt:'He stayed', dd:'Of the original Twelve, one fell away. James did not. After the cross, after the resurrection, after the ascension, he was still there praying with the church. <em>Quiet endurance is itself a contribution.</em>'},
 {dt:'His name is on the foundations', dd:'Rev 21:14. Whatever he did with his obscure life, Christ counted it worthy of an eternal memorial.'},
 {dt:'He was sent', dd:'&ldquo;He appointed twelve&hellip; so that they might be with him and he might send them out&rdquo; (Mark 3:14). The commission was his too.'}
],
tradition:'Because Scripture says so little, later church tradition tried to fill the gap with accounts of his ministry and martyrdom. <b>These are tradition, not Scripture &mdash; and the traditions disagree with one another and frequently confuse him with the other Jameses.</b> Don&rsquo;t anchor anything in them. If someone has heard a specific &ldquo;James was martyred by&hellip;&rdquo; story, receive it gently and label it. The most honest thing we can say: <em>the church remembered he existed and was faithful, and trusted his reward to God.</em>',
guardrail:{
 speech:'Hear me carefully. Tonight is <em>not</em> &ldquo;be quietly faithful like James and maybe God will notice you.&rdquo; We don&rsquo;t even know James&rsquo;s faithfulness to copy &mdash; Scripture didn&rsquo;t show us. What we know is that <em>Jesus chose him, named him, sent him, and treasured him</em> &mdash; and Jesus did it for a man the world would never write a single line about. Jesus does not grade on platform or fame. The unnamed apostle is no less chosen, no less loved, no less commissioned than Peter. So the question for you tonight is not &ldquo;am I doing enough hidden good to earn God&rsquo;s attention?&rdquo; The gospel is the other way around: <em>you are already seen, already chosen, already loved by the One whose attention is the only one that finally matters.</em> Faithfulness witnessed only by God is not second-class. It is enough &mdash; because being known to God is enough.',
 foot:'<b>Indicative before imperative.</b> We don&rsquo;t become significant by going unnoticed for Jesus; we are <em>already</em> significant because Jesus chose us &mdash; and out of that settled, seen-by-God identity we are freed to live faithfully whether anyone ever notices or not. Four things stay true of him with the page nearly blank: he was <b>chosen</b> (Luke 6:12&ndash;13), <b>named</b> (Rev 21:14), <b>sent</b> (Mark 3:14), and <b>kept</b> (Acts 1:14).'
},
questions:[
 {lead:'We know nothing about James but his name &mdash; yet Jesus chose him as one of the Twelve.', rest:'What does that say to anyone who feels unseen?'},
 {lead:'Most faithful Christians never get their story told.', rest:'Are you okay being known to God but unknown to history?'},
 {lead:'James was still in the upper room praying after the ascension (Acts 1:13).', rest:'What does quiet, unrewarded faithfulness look like for you?'},
 {lead:'Our culture rewards visibility.', rest:'Where are you tempted to <em>perform</em> your faith rather than simply live it?', land:true},
 {lead:'If your discipleship were never noticed by anyone but God, would that be enough for you?', rest:'Be honest.', land:true}
],
couples:'So much of a marriage is faithfulness no one else ever sees &mdash; the unglamorous, unwitnessed serving you do for each other day after day. Where has your spouse been quietly faithful in a way the world would never notice but God surely does? Tell them. And where do you need to stop keeping score on who gets credit?',
dry:'<em>&ldquo;Who is the most faithful person you have ever known that the world will never hear about?&rdquo;</em> It gets specific, tender answers fast, and lands the whole night on real people instead of abstraction.',
takeaway:'&ldquo;You don&rsquo;t need a platform to be chosen. The disciple we know least is still one of the twelve foundation stones of the church &mdash; because Jesus chooses, treasures, and sends people the world never notices. <b>Known to God is enough.</b>&rdquo;',
prayer:'Close in prayer. Thank Jesus that he sees the hidden ones &mdash; that he chose, named, sent, and kept a man whose whole story is a single line, and that he does the same for everyone in the room. Ask him to free the group from the tyranny of being seen, and to settle them in the sufficiency of being known to God.',
readaloud:'<b>Read at 0:08 &mdash; read all four, so the group</b> hears <b>how little there is:</b> Matthew 10:2&ndash;4, Mark 3:16&ndash;19, Luke 6:13&ndash;16, then Acts 1:12&ndash;14. Reading them back to back <em>is</em> the teaching. Let the room notice: in three his name is one item in a list; in the fourth he is simply present and praying with the others. That is the entire biblical record.',
anchors:[
 {ref:'Matt 10:3 &middot; Mark 3:18 &middot; Luke 6:15', note:'the call lists &mdash; every place he is named'},
 {ref:'Acts 1:13&ndash;14', note:'in the upper room, devoted to prayer'},
 {ref:'Luke 6:12&ndash;13', note:'Jesus prayed all night before choosing the Twelve'},
 {ref:'Mark 3:14', note:'appointed to be with him and to be sent out'},
 {ref:'Rev 21:14', note:'the twelve names on the foundations of the city'},
 {ref:'1 Cor 1:28&ndash;29 &middot; 2 Tim 2:19', note:'God chooses the low; the Lord knows those who are his'}
],
glance:[
 {dt:'Name', dd:'James, Hebrew <i>Jacob</i> &middot; &ldquo;son of Alphaeus,&rdquo; the patronymic that distinguishes him from James son of Zebedee.'},
 {dt:'Every biblical mention', dd:'Matt 10:3, Mark 3:18, Luke 6:15, Acts 1:13. Name only. <span class="note">No words, no deeds recorded anywhere</span>'},
 {dt:'Uncertain identifications', dd:'Possibly &ldquo;James the younger&rdquo; of Mark 15:40; possibly brother of Matthew/Levi. <span class="note">Both inferences, never stated</span>'},
 {dt:'Clock note', dd:'Teaching runs short tonight by necessity. You may reach the turn early &mdash; <b>don&rsquo;t fill it with legends.</b> Give the extra minutes to discussion.'}
]
});
S.push({
n:10, slug:'thaddaeus', name:'Thaddaeus / Jude', group:3,
sub:'Judas the son of James &middot; &ldquo;Judas, not Iscariot&rdquo;',
hook:'The one who asked the quiet question &mdash; and Jesus answered it not with a debate, but with <em>a promise to come and make his home in him.</em>',
essence:'The one who asked the quiet question.',
warn:'<b>The name situation, so you can explain it rather than trip over it.</b> He is <b>Thaddaeus</b> in Matthew and Mark, and <b>Judas the son of James</b> in Luke and Acts. Some manuscripts of Matthew add <b>Lebbaeus</b>. The church has long understood these to be the same man under different names, common enough in a world where people carried more than one. The exact relationship of the names is debated by scholars; what matters is that the same slot in all four lists is filled by this one quiet disciple.',
spine:[
 {ref:'John 14:21 &middot; what he heard', head:'Jesus promised to &ldquo;manifest&rdquo; himself', body:'Whoever keeps my commandments loves me, and I will love him and manifest myself to him. Thaddaeus was clearly listening, and he caught the surprising implication.'},
 {ref:'John 14:22 &middot; his one line', head:'&ldquo;Why us, and not the world?&rdquo;', body:'His entire recorded speech in all of Scripture: one sincere, thoughtful question. No edge, no test. He was honest enough to name the tension instead of pretending it was not there.'},
 {ref:'John 14:23 &middot; the answer', head:'&ldquo;We will make our home with him&rdquo;', body:'Not a fact about how the kingdom works. A promise of presence. The Father and the Son moving in. We have that sentence on record because Thaddaeus asked.'}
],
links:['So he asked','And Jesus moved in'],
prep:[
 'This disciple is barely a name in the Gospel lists, and that is most of the point tonight. He shows up in all four rosters of the Twelve, under two different names, and has <b>exactly one recorded sentence</b> in all of Scripture &mdash; a sincere, honest question. What makes the session land is <em>what his question drew out of Jesus</em>: one of the richest promises in the whole Gospel of John.',
 'The right frame for a mixed-maturity room: most people carry a real question about Jesus they have never said out loud, sometimes for years, often because they assume a question is a sign of weak faith. Thaddaeus voiced his, and <b>Jesus didn&rsquo;t scold him. He answered with himself.</b> That is the gift tonight &mdash; permission to ask, and the discovery of what the answer is.',
 '<b>The trap to avoid:</b> &ldquo;Ask better questions like Thaddaeus.&rdquo; The lesson is <em>not</em> a technique for asking the right thing the right way &mdash; that just turns a quiet, faithful man into a self-improvement mascot. <b>The point is the answer, not the question.</b> Keep returning there: Jesus answers the honest question with his own indwelling presence.'
],
scenes:[
 {tag:'John 14:22', head:'Inquisitive', body:'His one recorded act is to <em>ask</em>. Not to argue, not to correct Jesus, not to volunteer for something. To ask an honest question about what Jesus had just said.'},
 {tag:'John 14:22', head:'Sincere', body:'There is no edge in his question and no test in it. It reads as a genuine attempt to understand &mdash; the kind of person who would rather ask than quietly assume he had figured it out.'},
 {tag:'John 14:21&ndash;22', head:'Attentive', body:'He had clearly been listening. Jesus had just said he would manifest himself to those who love and keep his word, and Thaddaeus caught the implication and wanted it spelled out.'},
 {tag:'John 14:22', head:'Easy to overlook', body:'The kind of disciple who never makes the highlight reel &mdash; no walking on water, no bold confession, no rebuke. <em>Just present, listening, and willing to ask.</em>'}
],
leadernote:'Don&rsquo;t apologize for how little we know about him, and don&rsquo;t pad the gap with guesses. <b>The smallness is the gift tonight</b> &mdash; most people in the room feel like the obscure disciple, not the famous one. A man with one line who drew out one of Jesus&rsquo;s greatest promises is exactly the encouragement an ordinary group needs.',
versus:{
 aK:'What he assumed a Messiah would do', aQuote:'&ldquo;How is it that you will manifest yourself to us, and not to the world?&rdquo;',
 aBody:'Behind the question is an assumption a lot of the disciples shared: that the Messiah&rsquo;s arrival would be <b>public, political, and unmissable</b> &mdash; a conquering display the whole world would be forced to acknowledge.',
 bK:'What Jesus said instead', bQuote:'&ldquo;We will come to him and make our home with him.&rdquo;',
 bBody:'Not spectacle the whole world can see. <em>He reveals himself by moving in</em> &mdash; the Father and the Son making their home in the one who loves and keeps his word.'
},
down:'The question was &ldquo;how will you reveal yourself?&rdquo; The answer was &ldquo;by coming to live with you.&rdquo;',
after:'And sit with one more thing for a second. This man <b>shared a name with the most infamous traitor in history</b>, and is mostly remembered by nicknames to keep the two apart. John makes the distinction explicit at the very moment he speaks &mdash; he calls him <em>&ldquo;Judas (not Iscariot)&rdquo;</em> (John 14:22). His name had to be qualified so nobody would confuse the faithful Judas with the betrayer.',
contribution:[
 {dt:'He drew out the indwelling promise', dd:'John 14:23 is one of the richest verses in the New Testament &mdash; the Father and the Son making their <em>home</em> with the believer. We have that sentence on record because <b>Thaddaeus asked.</b>'},
 {dt:'Faithfulness without a platform', dd:'He is chosen, present for three years, and listed among the Twelve forever &mdash; and he never needed to be famous to be faithful. Most disciples of Jesus serve exactly here.'},
 {dt:'One sentence, well spent', dd:'Of all the words he could have had recorded, the one we got was an honest question brought to the right Person.'},
 {dt:'Named in all four lists', dd:'Matt 10:3, Mark 3:18, Luke 6:16, Acts 1:13 &mdash; there from the choosing through the upper room.'}
],
tradition:'Later ministry in regions such as <b>Mesopotamia, Persia, or Armenia</b>, ending in <b>martyrdom</b> &mdash; held by various traditions, with the accounts differing. <b>Tradition, not Scripture.</b> He is sometimes connected with the <b>epistle of Jude</b>, but that authorship is <b>uncertain and debated</b> and we do not assert it: the letter&rsquo;s own author calls himself &ldquo;a brother of James&rdquo; (Jude 1:1), and whether that is this Judas is not settled. Flag it, don&rsquo;t claim it.',
guardrail:{
 speech:'This is <em>not</em> a &ldquo;learn to ask better questions like Thaddaeus&rdquo; lesson. The point isn&rsquo;t his question &mdash; it is Jesus&rsquo;s <em>answer</em>. Look at what Jesus does: he takes an honest, slightly confused question and responds not with a correction but with a promise to come and live inside the person who loves him. The grace is in the answer. Jesus answers the honest question with his own indwelling presence. So when you bring him your real question tonight, you are not risking a rebuke &mdash; you are being invited into the same promise. <em>He doesn&rsquo;t just answer your question; he comes to make his home in you.</em>',
 foot:'<b>Indicative before imperative.</b> The &ldquo;keep my word&rdquo; of John 14:23 is the <em>fruit</em> of the love Jesus first puts in us and the home he first makes with us &mdash; not the <em>price</em> we pay to earn his presence. We keep his word <b>because</b> he has come to live with us, not in order to get him to come. And notice what Jesus does <em>not</em> do: he never says the question is foolish, never tells Thaddaeus he should already know, never pivots into a debate about the timing of the kingdom. <b>He honors the honest question.</b>'
},
questions:[
 {lead:'Thaddaeus&rsquo;s one recorded line is a sincere question.', rest:'What honest question about Jesus are you carrying that you have never voiced &mdash; and what has kept you from saying it out loud?'},
 {lead:'He wondered why Jesus shows himself to disciples and not the whole world.', rest:'How does Jesus reveal himself to the world today &mdash; and what is <em>your</em> part in that?'},
 {lead:'He had to share a name with the betrayer, and is mostly remembered by nicknames.', rest:'How do you handle being defined by associations you did not choose &mdash; a family reputation, a past, a label that stuck?'},
 {lead:'Jesus answered his question with a promise of presence, not a debate.', rest:'When you bring God a real question, do you actually <em>expect</em> an answer &mdash; or have you stopped expecting one?', land:true},
 {lead:'What is one question you could bring to <em>this group</em> tonight', rest:'instead of carrying it alone?', land:true}
],
couples:'Is there an honest question about faith, or about each other, that one of you has been carrying silently, afraid it would sound like doubt? What would it look like to ask it out loud this week, and to receive it the way Jesus received Thaddaeus&rsquo;s &mdash; without scoring it?',
dry:'<em>&ldquo;What is a question about God you have had for a long time and never actually asked anyone?&rdquo;</em> Naming it as normal and safe usually opens the room faster than any other prompt in the series.',
takeaway:'&ldquo;Your honest question isn&rsquo;t a threat to your faith &mdash; <b>it is an invitation.</b> Jesus answers the honest question with his own presence: we will come to him and make our home with him.&rdquo;',
prayer:'Close in prayer. Thank Jesus that he welcomes the honest question and answers it with himself &mdash; that he does not reveal his love only in spectacle the world can see, but by coming to make his home in those who love him. Ask him to give the group the courage to voice what they have been carrying, and to meet each question with his indwelling presence.',
readaloud:'<b>Read at 0:08:</b> John 14:22&ndash;24, his question and Jesus&rsquo;s answer. Then read the four list verses so the group hears the name situation for themselves &mdash; Matthew 10:3, Mark 3:18, Luke 6:16, Acts 1:13. Hearing &ldquo;Thaddaeus&rdquo; in two lists and &ldquo;Judas the son of James&rdquo; in the other two, back to back, lets the group feel the puzzle before you explain it.',
anchors:[
 {ref:'Matt 10:3 &middot; Mark 3:18', note:'listed as Thaddaeus'},
 {ref:'Luke 6:16 &middot; Acts 1:13', note:'listed as Judas the son of James'},
 {ref:'John 14:21', note:'the promise that prompts the question'},
 {ref:'John 14:22', note:'his one recorded line; &ldquo;Judas, not Iscariot&rdquo;'},
 {ref:'John 14:23', note:'we will come to him and make our home with him'}
],
glance:[
 {dt:'Names', dd:'Thaddaeus &middot; Judas the son of James &middot; <span class="note">Lebbaeus in some manuscripts</span>'},
 {dt:'Not to be confused with', dd:'Judas Iscariot. John 14:22 says &ldquo;Judas (not Iscariot)&rdquo; on purpose.'},
 {dt:'Recorded words', dd:'One sentence, John 14:22 &mdash; and it drew out the indwelling-presence promise of the next verse.'},
 {dt:'Epistle of Jude?', dd:'Sometimes attributed to him. <span class="note">Uncertain and debated. Not asserted here</span>'}
]
});
S.push({
n:11, slug:'simon-zealot', name:'Simon the Zealot', group:3,
sub:'Simon the Cananaean &middot; no recorded words, one loaded label',
hook:'The political radical who became a brother &mdash; living proof that the gospel can seat <em>sworn enemies</em> at the same table and make them one.',
essence:'The political radical who became a brother.',
warn:'<b>A word study worth getting right, and it takes twenty seconds.</b> Your ESV reads &ldquo;Simon the Zealot&rdquo; in all four lists, but the word behind the English differs. Matthew and Mark preserve an Aramaic-derived term, <i>kananaios</i> &mdash; see the ESV footnote at Matt 10:4 and Mark 3:18. It does <b>not</b> mean &ldquo;from Cana&rdquo; or &ldquo;from Canaan.&rdquo; It is the Aramaic word for zealot. Luke, writing for a Greek audience, simply translated it (<i>z&emacr;l&omacr;t&emacr;s</i>). <b>All four lists agree: this is Simon the Zealot. Two words, one meaning.</b> Have someone read the footnote out loud.',
spine:[
 {ref:'Matt 10:3&ndash;4 &middot; the roster', head:'A zealot and a tax collector', body:'On the same team of twelve, Jesus placed Simon the Zealot and Matthew the tax collector. One worked for Rome and profited from the occupation. The other burned to see men like that gone.'},
 {ref:'John 18:36 &middot; the re-ordering', head:'&ldquo;My kingdom is not of this world&rdquo;', body:'Imagine a zealot hearing that. Watching Jesus refuse the sword, refuse the rebellion, refuse the crown the crowd tried to force on him. Following Jesus meant a deep re-ordering of what he expected God to do.'},
 {ref:'Eph 2:14 &middot; the result', head:'&ldquo;He himself is our peace&rdquo;', body:'Christ has made us both one and broken down in his flesh the dividing wall of hostility. Not a unity the world can manufacture. One Jesus created by calling enemies into one body.'}
],
links:['Then a new King','Then one body'],
prep:[
 'Simon is one of the disciples Scripture names but never quotes. We get his name and a single, loaded label, and nothing else &mdash; no recorded words, no recorded deeds. That makes him the right disciple for <em>this</em> moment in the series, because the one thing we know about him is the most provocative thing on the roster: <b>Jesus put a political radical and a tax collector on the same team.</b>',
 'By every cultural rule of their day, these two were enemies. <b>Jesus made them brothers.</b> Tonight&rsquo;s job is to let the group feel how scandalous that was, then turn their eyes from Simon&rsquo;s politics to the Christ who reconciles enemies into one body.',
 '<b>The trap to avoid:</b> &ldquo;Be more zealous like Simon.&rdquo; That misses the whole point. Simon&rsquo;s zeal isn&rsquo;t the hero of the story &mdash; it is the raw material Jesus <em>re-aimed</em>. The lesson isn&rsquo;t &ldquo;care harder about your cause.&rdquo; It is that Jesus gives a man whose deepest allegiance was a political vision a <em>deeper</em> allegiance, then seats him next to the very kind of man he would have despised. <b>Keep returning to the reconciliation, not the intensity.</b>'
],
scenes:[
 {tag:'Luke 6:15', head:'Passionate', body:'Zealot is not a neutral word. It names someone who cares to the point of risk &mdash; whose convictions move his feet.'},
 {tag:'Matt 10:4', head:'Intense and committed', body:'A man defined by a cause big enough to organize his whole identity around. He was not a bystander to his world.'},
 {tag:'Mark 3:18', head:'Politically charged', body:'His loyalty had an edge to it &mdash; a clear sense of <em>us and them</em>, of a wrong that needed righting.'},
 {tag:'Acts 1:13', head:'And he stayed', body:'He is there in the upper room after the resurrection, among the eleven who waited and prayed. <em>He didn&rsquo;t bolt when the Messiah turned out to be a crucified one instead of a conquering one.</em>'}
],
leadernote:'<b>Don&rsquo;t invent a personality for Simon to make him a better illustration.</b> Everything we can say here we are reading <em>off the label</em>, not out of a narrative &mdash; the Gospels give us no scenes, no quotes, no character moments. Resist filling the silence with details Scripture doesn&rsquo;t give. The restraint is the point, and modeling that honesty in front of the group is worth as much as the content.',
versus:{
 aK:'What a zealot hoped for', aQuote:'A free Israel, and Rome driven out.',
 aBody:'National, political deliverance, possibly by force. If he hoped for a Messiah at all, he probably hoped for one who would <em>fight</em>. A note on precision: the organized Zealot <b>party</b> crystallized more fully later in the century, so frame the temperament and affiliation, don&rsquo;t over-claim a membership card.',
 bK:'What he had to learn instead', bQuote:'&ldquo;If my kingdom were of this world, my servants would have been fighting.&rdquo;',
 bBody:'An allegiance to Jesus that <em>outranked</em> his political identity. He came in loyal to a cause. He had to learn to be loyal to a Person first, and to let every other loyalty fall in line behind that one.'
},
down:'He had to lose his grip on the kingdom he wanted to receive the kingdom Jesus came to bring.',
after:'That is a familiar gap in this series &mdash; <b>right to care, wrong about how God would act.</b> Peter wanted a conquering Messiah and missed the cross. Simon, we can reasonably guess, wanted a liberating Messiah and had to discover that the liberation Jesus brought was bigger and stranger than driving out Rome.',
contribution:[
 {dt:'Living proof the gospel reconciles enemies', dd:'Don&rsquo;t rush past this &mdash; it <em>is</em> the legacy. The zealot and the tax collector sat at the same table, under the same Lord, for three years, and the early church told that story for a reason.'},
 {dt:'He stayed', dd:'Whatever re-ordering of his loyalties Jesus required, Simon let it happen. <b>The zealot became a man of the church</b> (Acts 1:13).'},
 {dt:'The roster itself preaches', dd:'The mere <em>fact</em> of Simon-and-Matthew on one list says it: in Christ, the deepest political and social hostilities lose their power to divide.'},
 {dt:'Named in all four lists', dd:'Matt 10:4, Mark 3:18, Luke 6:15, Acts 1:13 &mdash; always there, never quoted.'}
],
tradition:'Beyond Acts 1:13 the Bible says nothing more about Simon. Church tradition places his later ministry in various locations &mdash; <b>Persia, Egypt, and elsewhere are all named in different accounts</b> &mdash; and tells of his martyrdom. <b>These accounts conflict with one another and are not in Scripture.</b> If someone asks how Simon died, the honest answer is: <em>we don&rsquo;t know. Scripture doesn&rsquo;t say, and the traditions don&rsquo;t agree.</em> That honesty is more faithful than a confident story.',
guardrail:{
 speech:'This is <em>not</em> a &ldquo;be more zealous like Simon&rdquo; lesson, and it is not a &ldquo;pick the right cause&rdquo; lesson either. Look at what actually changed Simon: not better politics, not more passion &mdash; <em>a new King.</em> Jesus didn&rsquo;t reach Simon by out-arguing his cause. He reached him by being worth more than the cause, and then by seating him next to the man he used to hate. The reconciliation isn&rsquo;t something Simon achieved by being open-minded. It is something <em>Christ created</em> by calling enemies into one body. We don&rsquo;t manufacture this unity by trying harder to get along. We receive it because Jesus is our peace. Then we live like it is true.',
 foot:'<b>Indicative before imperative.</b> Christ first makes enemies into one body &mdash; <em>then</em> we walk in that oneness. The reconciliation comes as a gift before it becomes a calling. We don&rsquo;t build the bridge; we cross the one he already built. Paint the picture before you say it: picture the twelve at a meal. Down the table sits Matthew, who built a comfortable life skimming taxes for the occupying empire. A few seats over sits Simon, whose whole identity was burning to see men like Matthew gone. Left to themselves, enemies. <b>And now they pass the bread to each other.</b> Only Jesus does that.'
},
questions:[
 {lead:'Simon the Zealot and Matthew the tax collector were political enemies on the same team.', rest:'Who would be your Matthew &mdash; the person you genuinely can&rsquo;t picture God seating right next to you?'},
 {lead:'Simon&rsquo;s zeal got a new target rather than disappearing.', rest:'What passion or cause in you needs to be <em>re-aimed</em> at Jesus &mdash; not killed, but resubmitted to him?'},
 {lead:'The early church united people the culture said could never share a table.', rest:'Is your church, or this group, actually that? Or are we quietly sorted by politics, class and background while telling ourselves we are not?'},
 {lead:'Following Jesus meant Simon loosened his grip on a cause he would have killed for.', rest:'What loyalty &mdash; political, cultural, personal &mdash; might Jesus be asking you to hold <em>more loosely than him</em>?', land:true},
 {lead:'Where is God calling you to be reconciled', rest:'to someone you have written off as on &ldquo;the other side&rdquo;?', land:true}

<script>
/* ---------------------------------------------------------------
   The Twelve — Leader's Console
   Static single-file app. No dependencies, no network calls.
   Routes: #/  (overview)  ·  #/1 … #/12  (a session)
   --------------------------------------------------------------- */

var GROUPS = [
  { n:1, title:'The first four',
    detail:'Always named first in all four apostle lists, and always headed by Peter. Contains the inner three.' },
  { n:2, title:'The second four',
    detail:'Always named second, and always headed by Philip. Four men John shows us in conversation with Jesus.' },
  { n:3, title:'The last four',
    detail:'Always named last, and always ending with Judas. Three we know almost nothing about, and one we wish we knew less.' }
];

var BEATS = [
  { at:0,  min:5, name:'Welcome &amp; gather' },
  { at:5,  min:3, name:'Open &amp; frame' },
  { at:8,  min:5, name:'Read the Word' },
  { at:13, min:8, name:'His story',            cls:'teach' },
  { at:21, min:7, name:'His personality',      cls:'teach' },
  { at:28, min:8, name:'His perspective',      cls:'teach' },
  { at:36, min:8, name:'His contribution',     cls:'teach' },
  { at:44, min:6, name:'The Christ-centered turn', cls:'pivot' },
  { at:50, min:8, name:'Discussion',           cls:'heart' },
  { at:58, min:2, name:'Close' }
];

var CLOCK_KEY = 'twelve-console-start';

/* ---------------- helpers ---------------- */
function el(tag, cls, html){
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
}
function byN(n){
  for (var i=0;i<S.length;i++){ if (S[i].n === n) return S[i]; }
  return null;
}
function ord(n){ return n < 10 ? '0' + n : '' + n; }

/* ---------------- nav rail ---------------- */
function buildNav(){
  var nav = document.getElementById('nav');
  nav.innerHTML = '';

  var brand = el('div','brand');
  brand.appendChild(el('a', null,
    '<span class="sup">D Group series</span>' +
    '<span class="nm">The Twelve</span>' +
    '<span class="cad">Twelve sessions, one disciple a night. 60-minute leader&rsquo;s guides, ESV throughout.</span>'));
  brand.querySelector('a').setAttribute('href','#/');
  nav.appendChild(brand);

  GROUPS.forEach(function(g){
    var wrap = el('div','navgroup');
    wrap.appendChild(el('div','gl', g.title));
    S.filter(function(s){ return s.group === g.n; })
     .sort(function(a,b){ return a.n - b.n; })
     .forEach(function(s){
       var a = el('a','navlink',
         '<span class="i">' + ord(s.n) + '</span><span>' + s.name + '</span>');
       a.setAttribute('href','#/' + s.n);
       a.setAttribute('data-n', s.n);
       wrap.appendChild(a);
     });
    nav.appendChild(wrap);
  });

  var foot = 'Use <b>&larr;</b> and <b>&rarr;</b> to move between sessions, <b>Esc</b> for the overview.';
  /* Only offer the map link when this page is served beside the TV companion. */
  if (/\/guides\/?$/.test(location.pathname)){
    foot += '<br><br><a href="../" style="color:var(--brass);text-decoration:none">&larr; The disciple map</a>';
  }
  nav.appendChild(el('div','navfoot', foot));
}

function markNav(n){
  var links = document.querySelectorAll('.navlink');
  for (var i=0;i<links.length;i++){
    links[i].classList.toggle('on', parseInt(links[i].getAttribute('data-n'),10) === n);
  }
}

/* ---------------- session clock ---------------- */
function fmtClock(totalMin){
  var m = ((totalMin % 1440) + 1440) % 1440;
  var h = Math.floor(m / 60), mm = m % 60;
  var ampm = h >= 12 ? 'pm' : 'am';
  var h12 = h % 12; if (h12 === 0) h12 = 12;
  return h12 + ':' + (mm < 10 ? '0' + mm : mm) + ampm;
}

function renderClock(){
  var input = document.getElementById('start');
  if (!input) return;
  var v = (input.value || '').split(':');
  var base = (parseInt(v[0],10) * 60) + parseInt(v[1],10);
  if (isNaN(base)) base = 19 * 60;

  var now = new Date();
  var nowMin = now.getHours() * 60 + now.getMinutes();
  var elapsed = nowMin - base;
  var live = elapsed >= 0 && elapsed < 60;

  var rows = document.querySelectorAll('#beats .beat');
  for (var i=0;i<rows.length;i++){
    var at = parseInt(rows[i].getAttribute('data-at'),10);
    var next = (i+1 < rows.length) ? parseInt(rows[i+1].getAttribute('data-at'),10) : 60;
    rows[i].querySelector('.clock').textContent = fmtClock(base + at);
    rows[i].classList.toggle('now', live && elapsed >= at && elapsed < next);
  }
}

function clockRail(){
  var html = '<h2>Session clock</h2>' +
    '<div class="startline"><label for="start">Started</label>' +
    '<input type="time" id="start" value="19:00"></div>' +
    '<ol class="beats" id="beats">';
  BEATS.forEach(function(b){
    html += '<li class="beat ' + (b.cls || '') + '" data-at="' + b.at + '">' +
            '<span class="clock"></span>' +
            '<span class="name">' + b.name + '<span class="mins">' + b.min + '</span></span></li>';
  });
  html += '</ol>' +
    '<p class="teach-note">The four middle beats (0:13&ndash;0:44) are one flowing 30-minute narration with room to pause &mdash; not four lectures. Let discussion bleed in early when the room is engaged.</p>' +
    '<div class="clockwarn"><b>Check the clock at 0:44.</b> If teaching ran long, trim <b>His contribution</b> &mdash; never the discussion block. The discussion is the point.</div>';
  return html;
}

/* ---------------- one session ---------------- */
function renderSession(s){
  var m = document.getElementById('main');
  var h = '';

  /* masthead + spine */
  h += '<div class="wrap"><header class="mast">' +
       '<div class="eyebrow"><span>Session ' + s.n + ' of 12</span>' +
       '<span class="sep">/</span><span class="plain">60-minute leader&rsquo;s guide</span>' +
       '<span class="sep">/</span><span class="plain">ESV throughout</span></div>' +
       '<h1>' + s.name + '<span class="sub">' + s.sub + '</span></h1>' +
       '<p class="hook">' + s.hook + '</p>';

  h += '<div class="spine"><div class="spine-label">The spine of the night</div><div class="stations">';
  s.spine.forEach(function(st, i){
    if (i > 0){
      h += '<div class="link"><div class="rule"></div><div class="word">' +
           (s.links[i-1] || '') + '</div></div>';
    }
    h += '<div class="station' + (st.cost ? ' cost' : '') + '">' +
         '<div class="ref">' + st.ref + '</div><h3>' + st.head + '</h3><p>' + st.body + '</p></div>';
  });
  h += '</div></div></header>';

  /* working grid */
  h += '<div class="grid"><aside class="rail">' + clockRail() + '</aside><div class="col">';

  if (s.warn){
    h += '<section class="tradition" style="margin-top:0"><div class="k">Before you teach</div>' + s.warn + '</section>';
  }

  h += '<section><div class="shead"><h3 class="t">Why him, and the one trap</h3>' +
       '<span class="when">Leader&rsquo;s prep</span></div>';
  s.prep.forEach(function(p){ h += '<p class="lede">' + p + '</p>'; });
  h += '</section>';

  h += '<section><div class="shead"><h3 class="t">Four scenes</h3>' +
       '<span class="when">0:21 &middot; his personality</span></div><div class="scenes">';
  s.scenes.forEach(function(sc){
    h += '<div class="scene"><div class="tag">' + sc.tag + '</div><h4>' + sc.head + '</h4><p>' + sc.body + '</p></div>';
  });
  h += '</div><div class="tradition" style="margin-top:1px"><div class="k">Leader note</div>' + s.leadernote + '</div></section>';

  h += '<section><div class="shead"><h3 class="t">The gap he had to cross</h3>' +
       '<span class="when">0:28 &middot; his perspective</span></div><div class="versus">' +
       '<div class="a"><div class="k">' + s.versus.aK + '</div><blockquote>' + s.versus.aQuote +
       '</blockquote><p>' + s.versus.aBody + '</p></div>' +
       '<div class="b"><div class="k">' + s.versus.bK + '</div><blockquote>' + s.versus.bQuote +
       '</blockquote><p>' + s.versus.bBody + '</p></div></div>' +
       '<p class="downline">' + s.down + '</p>' +
       '<p class="lede" style="margin-top:20px">' + s.after + '</p></section>';

  h += '<section><div class="shead"><h3 class="t">What he gave the church</h3>' +
       '<span class="when">0:36 &middot; his contribution</span></div><div class="facts">';
  s.contribution.forEach(function(c){
    h += '<div class="fact"><dt>' + c.dt + '</dt><dd>' + c.dd + '</dd></div>';
  });
  h += '</div><div class="tradition"><div class="k">Flag it as you go</div>' + s.tradition + '</div></section>';

  h += '<section class="guardrail">' +
       '<div class="say">0:44 &middot; the Christ-centered turn &mdash; say this out loud</div>' +
       '<p class="speech">' + s.guardrail.speech + '</p>' +
       '<p class="foot">' + s.guardrail.foot + '</p></section>';

  h += '<section><div class="shead"><h3 class="t">Discussion</h3>' +
       '<span class="when">0:50 &middot; protect these 8 minutes</span></div>';
  if (s.couplesNote){ h += '<p class="lede" style="margin-bottom:18px">' + s.couplesNote + '</p>'; }
  h += '<ol class="qs">';
  s.questions.forEach(function(q, i){
    h += '<li class="' + (q.land ? 'land' : '') + '"><span class="n">' + (i+1) + '</span>' +
         '<p class="q"><b>' + q.lead + '</b> <span>' + q.rest + '</span></p>' +
         (q.land ? '<span class="tick">land here</span>' : '') + '</li>';
  });
  h += '</ol><div class="couples"><div class="k">For the couples in the room</div>' + s.couples + '</div>' +
       '<p class="dry"><b>If it runs dry:</b> ' + s.dry + '</p></section>';

  h += '<section class="takeaway"><div class="k">0:58 &middot; the takeaway to carry</div>' +
       '<blockquote>' + s.takeaway + '</blockquote>' +
       '<p class="lede" style="margin-top:24px">' + s.prayer + '</p></section>';

  h += '<section><div class="shead"><h3 class="t">Read aloud &amp; quick reference</h3>' +
       '<span class="when">0:08 &middot; ESV</span></div>' +
       '<p class="lede" style="margin-bottom:18px">' + s.readaloud + '</p><p class="anchors">';
  h += s.anchors.map(function(a){ return '<b>' + a.ref + '</b> &mdash; ' + a.note; }).join(' &middot; ');
  h += '</p><div class="facts" style="margin-top:22px">';
  s.glance.forEach(function(g){
    h += '<div class="fact"><dt>' + g.dt + '</dt><dd>' + g.dd + '</dd></div>';
  });
  h += '</div></section>';

  /* pager */
  var prev = byN(s.n - 1), next = byN(s.n + 1);
  h += '<div class="pager">';
  h += prev
    ? '<a href="#/' + prev.n + '"><div class="k">&larr; Session ' + prev.n + '</div><div class="nm">' + prev.name + '</div></a>'
    : '<a href="#/"><div class="k">&larr; Overview</div><div class="nm">All twelve</div></a>';
  h += next
    ? '<a class="r" href="#/' + next.n + '"><div class="k">Session ' + next.n + ' &rarr;</div><div class="nm">' + next.name + '</div></a>'
    : '<a class="r" href="#/"><div class="k">End of the series &rarr;</div><div class="nm">Back to the overview</div></a>';
  h += '</div>';

  h += '<footer><b>The Twelve</b> &middot; house style: ESV throughout, grace before command, ' +
       'extra-biblical traditions flagged as tradition &middot; the full written guide for this night is ' +
       '<b>' + ord(s.n) + ' ' + s.name + '.md</b></footer>';

  h += '</div></div>';

  m.innerHTML = h;

  var input = document.getElementById('start');
  try { var saved = localStorage.getItem(CLOCK_KEY); if (saved) input.value = saved; } catch(e){}
  input.addEventListener('input', function(){
    try { localStorage.setItem(CLOCK_KEY, input.value); } catch(e){}
    renderClock();
  });
  renderClock();
}

/* ---------------- overview ---------------- */
function renderOverview(){
  var m = document.getElementById('main');
  var h = '<div class="wrap"><header class="ov-mast">' +
    '<div class="eyebrow"><span>D Group series</span><span class="sep">/</span>' +
    '<span class="plain">Twelve sessions</span><span class="sep">/</span>' +
    '<span class="plain">1st &amp; 3rd Fridays</span></div>' +
    '<h1>The Twelve<span class="sub">One disciple a night, Simon Peter through Judas Iscariot</span></h1>' +
    '<p class="ov-lede">Jesus&rsquo;s strategy for reaching the world was not a program. It was <em>twelve ordinary, uneven, ' +
    'often-wrong men</em> he lived with for three years.</p>' +
    '<p class="ov-note">Studying them one at a time does two things for a disciple-making group. ' +
    '<b>It normalizes the mess</b> &mdash; these were fishermen, a tax collector, a political radical, a doubter, a betrayer; ' +
    'if Jesus built his church on <em>them</em>, no one in the room is too ordinary or too broken to be used. ' +
    'And <b>it keeps the eyes on Christ</b> &mdash; every disciple&rsquo;s story is really a story about how Jesus called, ' +
    'formed, corrected and commissioned a particular kind of person. The disciple is the window; Jesus is the view.</p>' +
    '<p class="ov-note"><b>The guardrail for the whole series:</b> the point of each night is never &ldquo;be more like Peter, ' +
    'or Thomas, or Matthew.&rdquo; It is &ldquo;see how Jesus dealt with this person, and trust that he deals with you the same way.&rdquo; ' +
    'We resist turning the apostles into self-improvement mascots.</p>' +
    '</header>';

  GROUPS.forEach(function(g){
    h += '<section class="ovgroup"><div class="gh"><h3 class="t">' + g.title + '</h3>' +
         '<div class="d">' + g.detail + '</div></div><div class="cards">';
    S.filter(function(s){ return s.group === g.n; })
     .sort(function(a,b){ return a.n - b.n; })
     .forEach(function(s){
       h += '<a class="card" href="#/' + s.n + '"><div class="i">Session ' + ord(s.n) + '</div>' +
            '<h4>' + s.name + '</h4><p>' + s.essence + '</p></a>';
     });
    h += '</div></section>';
  });

  h += '<div class="howto"><div class="k">How to use this in the room</div><ul>' +
    '<li>Click any disciple to open that night&rsquo;s <b>console</b>: the spine of the night, the four scenes, ' +
    'the spoken guardrail, and the five questions.</li>' +
    '<li>Set <b>Started</b> on the session clock and every beat gets a real wall-clock time. ' +
    'The beat you are in highlights itself.</li>' +
    '<li><kbd>&larr;</kbd> <kbd>&rarr;</kbd> move between sessions. <kbd>Esc</kbd> comes back here. ' +
    'Full screen with <kbd>F11</kbd>, or <kbd>Cmd</kbd>+<kbd>Ctrl</kbd>+<kbd>F</kbd> on a Mac.</li>' +
    '<li>The <b>guardrail</b> block on each session is written to be read aloud, word for word. That is the pivot of the night.</li>' +
    '<li>Anything outside Scripture is flagged <b>tradition, not Scripture</b>. Say it that way to the room.</li>' +
    '</ul></div>';

  h += '<footer><b>Twelve sessions &asymp; six months</b> at a 1st and 3rd Friday cadence. ' +
    'The sessions stand alone but build best in order, and there is a natural half-time after Session 6. ' +
    'House style: ESV throughout, a Christ-centered guardrail in every session (grace before command), ' +
    'questions calibrated for a mixed singles and couples group.</footer>';

  h += '</div>';
  m.innerHTML = h;
}

/* ---------------- router ---------------- */
function route(){
  var hash = location.hash.replace(/^#\/?/, '');
  var n = parseInt(hash, 10);
  var s = (!isNaN(n)) ? byN(n) : null;
  if (s){ renderSession(s); markNav(s.n); }
  else  { renderOverview();  markNav(-1); }
  window.scrollTo(0, 0);
}

window.addEventListener('hashchange', route);

document.addEventListener('keydown', function(e){
  if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  var cur = parseInt(location.hash.replace(/^#\/?/, ''), 10);
  if (e.key === 'Escape'){ location.hash = '#/'; return; }
  if (e.key === 'ArrowRight'){
    var nx = isNaN(cur) ? 1 : cur + 1;
    if (nx <= 12) location.hash = '#/' + nx;
  }
  if (e.key === 'ArrowLeft'){
    if (isNaN(cur)) return;
    if (cur - 1 >= 1) location.hash = '#/' + (cur - 1); else location.hash = '#/';
  }
});

S.sort(function(a,b){ return a.n - b.n; });
buildNav();
route();
setInterval(renderClock, 20000);
</script>
